<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inspect TEST">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-512.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: white top bar with a tangerine rule + black tab strip, one column of folding subsections.
   Palette for direct sun: pure white page, black text, every fill carries dark text and a black edge.
   Mint = required, powder blue = optional, red = missing, neon lime = done,
   highlighter yellow = where you are, tangerine = what you picked / what you're working on, lilac = camera. */
:root {
  --bg: #ffffff;
  --ink: #000000;
  --ink-2: #1c1c1c;
  --line: #000000;
  --soft: #f2f2f2;
  --bar: #ffffff;
  --tabbar: #000000;
  --tangerine: #ff8a00;
  --cyan: #ffb25c;
  --cyan-dk: #b35a00;
  --lime: #b4ff2e;
  --pink: #d9c6ff;
  --yellow: #fff200;
  --req: #c4f2d6;
  --req-ink: #0a4d27;
  --req-lt: #eefbf3;
  --opt: #a9cdf5;
  --opt-ink: #0b3570;
  --warn: #e00000;
  --warn-lt: #ffe1e1;
  --focus: #ff8a00;
  --go: #0fa84a;
  --font: "Atkinson Hyperlegible", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
  --bw: 3px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
#app:has(> header.bar) { padding-top: var(--barh, 130px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 19px/1.4 var(--font); -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* ---------- Top bar ---------- */
/* fixed (not sticky) so it never slides away when iOS scrolls or the keyboard opens; #app is padded by its height */
.bar { position: fixed; top: 0; left: 0; right: 0; padding-top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); color: var(--ink); border-bottom: 5px solid var(--tangerine); }
.bar-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; min-height: 60px; flex-wrap: wrap; }
.bar .title { flex: 1; min-width: 160px; }
.bar .title b { display: block; font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .title span { display: block; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { background: #fff; border: 3px solid #000; color: #000; border-radius: 8px; padding: 8px 12px; font-weight: 700; font-size: 16px; min-height: 46px; display: inline-flex; align-items: center; }
.saved { font-size: 15px; font-weight: 700; white-space: nowrap; background: #fff; border: 2px solid #000; border-radius: 6px; padding: 4px 8px; }
.attn-pill { background: var(--warn); color: #fff; border: 3px solid #000; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 16px; white-space: nowrap; min-height: 46px; }
.attn-pill.ok { background: var(--lime); color: #000; }
.hc-btn[aria-pressed="true"] { background: var(--yellow); }

.tabs { display: flex; gap: 2px; overflow-x: auto; padding: 0 8px; background: var(--tabbar); scrollbar-width: none; scroll-behavior: smooth; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: transparent; color: #fff; padding: 13px 14px 10px; font-weight: 700; font-size: 17px; border-bottom: 6px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--yellow); border-bottom-color: var(--yellow); background: #262626; text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 2px; }
.tab .dot { display: inline-block; min-width: 22px; height: 22px; line-height: 22px; border-radius: 11px; background: var(--warn); color: #fff; font-size: 13px; text-align: center; margin-left: 6px; padding: 0 6px; }
.tab .dot.done { background: var(--go); color: #fff; border: 2px solid #fff; }

main { max-width: 1080px; margin: 0 auto; padding: 14px 16px 140px; }

/* ---------- Legend / next missing ---------- */
.legend { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 0 0 14px; }
.lg { font-size: 15px; font-weight: 700; padding: 6px 10px; border-radius: 6px; border: 2px solid #000; }
.lg.req { background: var(--req); color: var(--req-ink); }
.lg.opt { background: var(--opt); color: var(--opt-ink); }
.lg.warn { background: var(--warn); color: #fff; min-height: 44px; font-size: 16px; }
.lg.warn:disabled { background: var(--lime); color: #000; }

/* ---------- Folding subsections ---------- */
.group { background: var(--bg); border: var(--bw) solid var(--line); border-radius: var(--r); margin-bottom: 14px; overflow: clip; scroll-margin-top: 140px; }
.ghead { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--soft); border: 0; text-align: left; font-weight: 700; color: #000; min-height: 64px; }
.ghead.static { background: #000; color: #fff; }
.group.open > .ghead { background: #000; color: #fff; }
.group.current > .ghead { background: var(--yellow); color: #000; border-bottom: 3px solid #000; }
.ghead .chev { font-size: 22px; width: 22px; }
.ghead .gtitle { font-size: 22px; letter-spacing: .01em; flex: 1; text-transform: uppercase; }
.ghead .count { font-size: 15px; font-weight: 700; }
.gstat { font-size: 14px; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 2px solid #000; white-space: nowrap; }
.gstat.miss { background: var(--warn); color: #fff; }
.gstat.ok { background: var(--lime); color: #000; }
.gfoot { padding: 14px 16px; border-top: 3px solid #000; background: var(--soft); display: flex; justify-content: flex-end; }
.btn.done { background: var(--lime); border-color: #000; color: #000; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 6px var(--tangerine) inset; } 100% { box-shadow: none; } }

/* ---------- Fields ---------- */
.fields { display: grid; grid-template-columns: 1fr; }
.field { padding: 12px 16px 14px 22px; border-bottom: 2px solid #c8c8c8; position: relative; min-width: 0; scroll-margin-top: 150px; }
.field:last-child { border-bottom: 0; }
.field::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: var(--opt); }
.field.req::before { background: var(--req); }
.field.missing::before { background: var(--warn); }
.field.missing { background: #fff; }
.flabel { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; font-weight: 700; font-size: 19px; }
.flabel .tag { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; background: var(--opt); color: var(--opt-ink); }
.field.req .flabel .tag { background: var(--req); color: var(--req-ink); }
.field.missing .flabel .tag { background: var(--warn); color: #fff; }
.flabel .fid { font-family: var(--mono); font-size: 13px; color: var(--ink-2); font-weight: 400; }
.pcount { background: var(--lime); color: #000; border: 2px solid #000; border-radius: 999px; padding: 2px 10px; font-size: 14px; }
.help { font-size: 16px; color: var(--ink-2); margin: -4px 0 8px; }
.calc { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.calc-text { font-size: 17px; font-weight: 700; background: var(--soft); border: 2px solid #000; border-radius: 8px; padding: 10px 12px; }
.info { background: var(--soft); color: #000; font-size: 16px; padding: 10px 14px; border-radius: 8px; border: 2px solid #000; font-weight: 700; }
.info.remind { background: var(--yellow); }
.note-field::before { display: none; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: var(--bw) solid #000; background: #fff; border-radius: 8px; padding: 10px 15px; min-height: 52px; font-size: 18px; line-height: 1.2; display: inline-flex; align-items: center; gap: 9px; text-align: left; color: #000; }
.chip .box { width: 24px; height: 24px; border: 3px solid #000; border-radius: 4px; flex: none; display: grid; place-items: center; background: #fff; }
.chip.radio .box { border-radius: 50%; }
.chip[aria-pressed="true"] { background: var(--cyan); font-weight: 700; box-shadow: 0 0 0 2px #000 inset; }
.chip[aria-pressed="true"] .box { background: #000; }
.chip[aria-pressed="true"] .box::after { content: ""; width: 10px; height: 5px; border: 3px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px,-1px); }
.chip.radio[aria-pressed="true"] .box::after { width: 10px; height: 10px; border: 0; background: #fff; border-radius: 50%; transform: none; }
.yn .chip { min-width: 104px; justify-content: center; }

input.txt, select.txt, textarea.txt { width: 100%; border: var(--bw) solid #000; border-radius: 8px; padding: 11px 12px; background: #fff; min-height: 52px; font-size: 19px; color: #000; }
input.txt:focus, select.txt:focus, textarea.txt:focus { outline: 4px solid var(--focus); outline-offset: 0; }
input.num { max-width: 240px; font-variant-numeric: tabular-nums; }
textarea.txt { min-height: 100px; resize: vertical; line-height: 1.45; }
.limit { font-size: 15px; color: var(--ink-2); text-align: right; margin-top: 4px; font-variant-numeric: tabular-nums; font-weight: 700; }
.limit.over { color: var(--warn); }

.stepper { display: inline-flex; align-items: center; border: var(--bw) solid #000; border-radius: 8px; overflow: hidden; }
.stepper button { width: 58px; height: 52px; border: 0; background: var(--soft); font-size: 28px; font-weight: 700; color: #000; }
.stepper output { min-width: 66px; text-align: center; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- Appliances ---------- */
.chip.appl-on { background: var(--cyan); }
.appl-edit { flex-basis: 100%; margin: 2px 0 6px; border: 3px solid #000; border-radius: 10px; padding: 12px; background: var(--yellow); display: grid; gap: 10px; }
.appl-title { font-size: 20px; font-weight: 700; }
.appl-edit .row { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- Photos ---------- */
.photo-slot { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
.cam { display: inline-flex; align-items: center; gap: 8px; border: 3px solid #000; color: #000; background: var(--pink); border-radius: 10px; padding: 12px 18px; min-height: 58px; font-weight: 700; font-size: 18px; position: relative; overflow: hidden; }
.cam input { position: absolute; inset: 0; opacity: 0; font-size: 0; cursor: pointer; }
.cam.lib { background: #fff; }
.cam svg { width: 24px; height: 24px; flex: none; }
.thumb { width: 140px; border-radius: 8px; overflow: hidden; border: 3px solid #000; background: var(--soft); padding: 0; text-align: left; }
.thumb img { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; max-width: 100%; }
.thumb span { display: block; font-size: 14px; font-weight: 700; padding: 5px 7px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb.req { border-color: var(--req); }
.group.extra { border-style: dashed; }
.extra-photos { padding: 14px 16px; background: var(--soft); display: flex; flex-direction: column; gap: 10px; }
.extra-photos h3 { font-size: 17px; text-transform: uppercase; letter-spacing: .04em; display: flex; gap: 10px; align-items: center; }

/* ---------- Lists (rooms, baths, etc.) ---------- */
.item { border-top: 3px solid #000; }
.item-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #fff; flex-wrap: wrap; }
.item.open > .item-head { background: #ffdcb5; }
.item-head .name { flex: 1; min-width: 200px; font-weight: 700; font-size: 20px; color: #000; border: 0; background: none; text-align: left; padding: 8px 0; }
.item-head .name small { font-weight: 700; color: var(--ink-2); font-size: 15px; margin-left: 10px; }
.item-head .badge { font-size: 14px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--warn); color: #fff; border: 2px solid #000; white-space: nowrap; }
.item-head .badge.ok { background: var(--lime); color: #000; }
.item-body { border-left: 8px solid var(--cyan); margin-left: 0; }
.btn { border: 3px solid #000; background: #fff; border-radius: 8px; padding: 10px 16px; font-weight: 700; min-height: 50px; font-size: 18px; color: #000; display: inline-flex; align-items: center; justify-content: center; }
.btn.primary { background: var(--tangerine); }
.btn.cyan { background: var(--opt); }
.btn.danger { color: var(--warn); }
.btn.danger.solid { background: var(--warn); color: #fff; }
.btn.sm { padding: 6px 12px; min-height: 44px; font-size: 16px; }
.add-row { padding: 14px 16px; display: flex; gap: 10px; flex-wrap: wrap; border-top: 3px solid #000; background: var(--soft); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--warn-lt); color: var(--warn); font-weight: 700; border-top: 2px solid var(--warn); }

/* ---------- CRS ---------- */
.crs { display: grid; gap: 12px; }
.crs-btn { position: relative; overflow: hidden; justify-self: start; }
.crs-btn input { position: absolute; inset: 0; opacity: 0; font-size: 0; cursor: pointer; }
.crs-loaded { font-weight: 700; background: var(--lime); border: 2px solid #000; border-radius: 6px; padding: 6px 10px; justify-self: start; font-size: 16px; }
.crs-table { border-collapse: collapse; width: 100%; font-size: 17px; }
.crs-table th, .crs-table td { text-align: left; vertical-align: top; border-bottom: 2px solid #c8c8c8; padding: 6px 8px; }
.crs-table th { width: 40%; }

/* ---------- Home ---------- */
.new-form { background: #fff; border: 3px solid #000; border-radius: var(--r); padding: 16px; display: grid; gap: 12px; grid-template-columns: 1fr; margin-bottom: 22px; box-shadow: 8px 8px 0 var(--tangerine); }
.new-form h2 { font-size: 22px; }
.new-form .flabel .tag { background: var(--req); color: var(--req-ink); }
.cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.card { border: 3px solid #000; border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 8px; background: #fff; text-align: left; }
.card b { font-size: 20px; }
.card .meta { font-size: 16px; color: var(--ink-2); font-weight: 700; }
.card .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.prog { height: 12px; background: #ddd; border-radius: 6px; overflow: hidden; border: 2px solid #000; }
.prog i { display: block; height: 100%; background: var(--req); }

/* ---------- Attention ---------- */
.att { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-top: 2px solid #c8c8c8; flex-wrap: wrap; }
.att .sev { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 4px 8px; border-radius: 4px; flex: none; border: 2px solid #000; }
.sev.Required, .sev.Photo { background: var(--warn); color: #fff; }
.sev.Recommended { background: var(--tangerine); color: #000; }
.sev.Check { background: var(--yellow); color: #000; }
.att .what { flex: 1; min-width: 200px; font-weight: 700; }
.att .what small { display: block; color: var(--ink-2); font-size: 15px; }
.att.overridden { opacity: .6; }
.att .ovr { width: 100%; display: flex; gap: 8px; }
.att .ovr input { flex: 1; }

/* ---------- Summaries ---------- */
.sum { padding: 14px 16px; border-top: 2px solid #c8c8c8; display: grid; gap: 10px; }
.sum h3 { font-size: 19px; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.sum h3 .fid { font-family: var(--mono); font-size: 14px; color: var(--ink-2); font-weight: 400; }
.sum .auto { background: var(--soft); border: 2px solid #000; border-radius: 8px; padding: 12px; font-size: 18px; line-height: 1.5; white-space: pre-wrap; }
.sum .auto.empty { color: var(--ink-2); font-style: italic; }
.sum .dropped { font-size: 16px; color: #8a3b00; font-weight: 700; }
.sum .row, .exp .row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Gallery ---------- */
.gal-sec h3 { font-size: 18px; text-transform: uppercase; letter-spacing: .04em; padding: 14px 16px 6px; }
.gal { display: flex; flex-wrap: wrap; gap: 10px; padding: 6px 16px 16px; }
.missing-photos { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 14px; }
.missing-photos button { border: 3px solid var(--warn); background: var(--warn-lt); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 16px; font-weight: 700; }
.missing-photos button.sug { border-color: #000; background: #fff; color: #000; }

/* ---------- Sheets, jump, toast, undo ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; display: grid; place-items: center; padding: 16px; }
.sheet { background: #fff; border-radius: 14px; max-width: 760px; width: 100%; max-height: 92vh; overflow: auto; border: 3px solid #000; }
.sheet img { display: block; width: 100%; max-height: 60vh; object-fit: contain; background: #000; }
.sheet .body { padding: 16px; display: grid; gap: 12px; }
.sheet .row { display: flex; gap: 10px; flex-wrap: wrap; }
.sheet.jump { align-self: start; margin-top: 40px; }
.jump-list { display: grid; gap: 6px; max-height: 60vh; overflow: auto; }
.jump-item { text-align: left; border: 2px solid #000; background: #fff; border-radius: 8px; padding: 10px 14px; font-weight: 700; font-size: 18px; padding-left: 34px; }
.jump-item.top { background: #000; color: #fff; padding-left: 14px; }
.jump-item small { display: block; font-size: 14px; color: var(--ink-2); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #000; color: var(--yellow); padding: 14px 20px; border-radius: 10px; z-index: 60; font-weight: 700; max-width: calc(100% - 32px); font-size: 18px; border: 3px solid var(--yellow); }
.undo-bar { position: fixed; left: 16px; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 61; background: var(--yellow); border: 3px solid #000; border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-weight: 700; max-width: 760px; margin: 0 auto; }
.undo-bar span { flex: 1; min-width: 180px; }

.exp { padding: 16px; display: grid; gap: 12px; border-top: 2px solid #c8c8c8; }
.exp:first-of-type { border-top: 0; }
.exp h3 { font-size: 20px; }
.exp p { margin: 0; color: var(--ink-2); font-size: 17px; max-width: 65ch; }
.warn-box { background: var(--warn-lt); color: var(--warn); border: 2px solid var(--warn); border-radius: 8px; padding: 10px 14px; font-size: 17px; font-weight: 700; }

@media (min-width: 900px) {
  .fields.two { grid-template-columns: 1fr 1fr; }
  .fields.two .field.wide { grid-column: 1 / -1; }
  .new-form { grid-template-columns: 2fr 1fr auto; align-items: end; }
}

/* Outdoor mode: even heavier type and borders */
html.hc body { font-size: 21px; }
html.hc .chip { font-size: 20px; min-height: 58px; border-width: 4px; }
html.hc .flabel, html.hc .help, html.hc .chip { font-weight: 700; }
html.hc .field { border-bottom-color: #000; }
html.hc .group { border-width: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

.fatal { margin: 16px; padding: 18px 20px; border: 4px solid var(--warn); border-radius: 12px; background: #fff; color: #000; font-size: 19px; }
.fatal h2 { color: var(--warn); margin: 0 0 8px; }
.fatal-msg { font-family: ui-monospace, Menlo, monospace; font-size: 15px; background: #f2f2f2; padding: 8px 10px; border-radius: 6px; word-break: break-word; }

.rename { display: flex; gap: 8px; align-items: center; flex: 1; flex-wrap: wrap; }
.rename .txt { flex: 1; min-width: 200px; }

.review { display: grid; gap: 0; border: 2px solid #000; border-radius: 8px; overflow: hidden; }
.rv-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #bbb; flex-wrap: wrap; background: #fff; }
.rv-row:last-child { border-bottom: 0; }
.rv-l { font-weight: 700; min-width: 190px; }
.rv-v { flex: 1; min-width: 160px; }
.rv-v.empty { color: var(--warn); font-weight: 700; }

/* keep the open room's name in view while scrolling through it */
.item.open > .item-head { position: sticky; top: var(--barh, 120px); z-index: 6; border-bottom: 3px solid #000; }

/* pale fills need an edge to read in sun */
.flabel .tag, .lg.req, .lg.opt { border: 2px solid #000; }
.cam { font-weight: 700; }
.item.open > .item-head { background: #ffdcb5; }
.chip[aria-pressed="true"] .box { background: #000; }

/* stoplight check beside each subsection: grey until reviewed, green when reviewed with nothing missing */
.ghead-row { display: flex; align-items: stretch; background: var(--soft); }
.group.open > .ghead-row { background: #000; }
.group.current > .ghead-row { background: var(--yellow); border-bottom: 3px solid #000; }
.group.open > .ghead-row .ghead { background: transparent; color: inherit; }
.group.open > .ghead-row { color: #fff; } .group.current > .ghead-row { color: #000; }
.ghead-row .ghead { flex: 1; background: transparent; }
.gcheck { flex: none; width: 52px; height: 52px; margin: 6px 0 6px 10px; align-self: center; border-radius: 50%; border: 3px solid #000; background: #d9d9d9; color: #8a8a8a; font-size: 28px; font-weight: 900; line-height: 1; display: grid; place-items: center; padding: 0; }
.gcheck.on { background: var(--go); color: #fff; }

/* section footer: big "done" button with the same stoplight check */

  const openOnce = ms => new Promise(res => {

    for (let i = 0; i < 4 && !db; i++) { db = await openOnce(i ? 3000 : 2500); if (!db) await wait(300); }

  const tx = (store, mode, fn, ms = 6000) => new Promise((res, rej) => {

    if (!db) { res(fn(null)); return; }

    async get(store, id) { if (!db && !closed) return mem[store].get(id); return tx(store, 'readonly', s => s.get(id)); },
    async del(store, id) { if (!db && !closed) { mem[store].delete(id); return; } return tx(store, 'readwrite', s => s.delete(id)); },
    async all(store) { if (!db && !closed) return [...mem[store].values()]; return tx(store, 'readonly', s => s.getAll()); },
    async photosFor(insId) {

/* Build the final text for a comment target within its limit */
function buildComment(ins, target) {
  if (ins.finals[target.id] !== undefined && ins.finals[target.id] !== null) {
    const t = ins.finals[target.id]; return { text: t, dropped: [], edited: true, over: t.length > target.lim };
  }
  const gen = (GEN[target.id] ? GEN[target.id](ins) : []).filter(Boolean).filter(x => x.t && x.t !== '.');
  const user = (ins.comments[target.id] || '').trim();
  let keep = gen.map((g, i) => ({ ...g, i }));
  const join = arr => [arr.map(x => x.t).join(' '), user].filter(Boolean).join(' ');
  const dropped = [];
  while (join(keep).length > target.lim && keep.length) {
    let worst = keep.reduce((a, b) => (b.p > a.p || (b.p === a.p && b.i > a.i)) ? b : a);
    dropped.push(worst.t); keep = keep.filter(x => x !== worst);
  }
  let text = join(keep);
  const over = text.length > target.lim;
  return { text, dropped, edited: false, over };
}

function roomQualityComment(listKey, it) {

    if (it.islands) parts.push(`${it.islands > 1 ? it.islands + ' islands' : 'an island'}${it.islandSeat ? ' with bar seating' : ''}`);

async function storageCheck() {

    out.push('Storage open: ' + (DB.persistent ? 'yes' : 'NO – the app could not open its storage'));

  try { out.push('Opened as: ' + (navigator.standalone || matchMedia('(display-mode: standalone)').matches ? 'Home Screen app' : 'Safari tab') + ' · ' + location.host); } catch (e) {}

  const groups = [...orphans.entries()];
  bg.innerHTML = `<div class="fatal" style="max-width:640px;width:100%;max-height:90vh;overflow:auto"><h2 style="color:#000">Storage check</h2>

    <p class="help">Take a screenshot of this box and send it to Claude.</p>

    b.disabled = true; b.textContent = 'Recovering…';
    try { await recoverPhotos(orphans.get(b.dataset.recover)); bg.remove(); toast('Photos recovered into a new inspection'); renderHome(); }
    catch (e) { b.textContent = 'Failed: ' + (e.message || e); }
  });
}

      html += `<div class="chips">${o.map(([c, l]) => `<button class="chip ${multi ? '' : 'radio'} ${ic && ic[c] ? 'withicon' : ''}" ${attr} data-v="${esc(c)}" aria-pressed="${arr.includes(c)}"><span class="box"></span>${ic && ic[c] ? `<svg class="chipicon" viewBox="0 0 64 40" aria-hidden="true">${ic[c]}</svg>` : ''}${esc(l)}</button>`).join('')}</div>`; break;
    }

    if (d.app !== 'appraisal-assistant' || d.kind !== 'active-orders') throw new Error('That is not an Active Orders file from the Appraisal Assistant.');
    const old = await DB.get('sketches', 'orders:active');

    for (const o of incoming) {

async function pdfLines(file) {

  const out = []; out.rows = [];
  for (let n = 1; n <= doc.numPages; n++) {
    const tc = await (await doc.getPage(n)).getTextContent(); const rows = new Map();
    tc.items.forEach(it => { if (!it.str.trim()) return; const y = Math.round(it.transform[5]); let k = [...rows.keys()].find(r => Math.abs(r - y) <= 2); if (k === undefined) { k = y; rows.set(k, []); } rows.get(k).push({ x: it.transform[4], s: it.str, w: it.width }); });
    [...rows.entries()].sort((a, b) => b[0] - a[0]).forEach(([, its]) => { its.sort((a, b) => a.x - b.x); let line = '', end = 0; const cells = []; its.forEach(i => { const gap = i.x - end; if (!line || gap > 8) cells.push({ x: i.x, s: i.s }); else cells[cells.length - 1].s += ' ' + i.s; line += (line ? (gap > 8 ? ' | ' : ' ') : '') + i.s; end = i.x + i.w; }); out.push(line.trim()); out.rows.push(cells.map(c => ({ x: c.x, s: c.s.trim() }))); });
  }
  return out;
}

function xsdSort(node) {   // put every element's children in schema order (unknown ones keep their place at the end)
  const seq = XSD_ORDER[node.localName]; const kids = [...node.children];
  if (seq && kids.length > 1) { const idx = n => { const i = seq.indexOf(n.localName); return i < 0 ? 1e6 : i; };
    const sorted = kids.map((k, i) => [k, i]).sort((a, b) => idx(a[0]) - idx(b[0]) || a[1] - b[1]).map(a => a[0]);
    if (sorted.some((k, i) => k !== kids[i])) sorted.forEach(k => node.appendChild(k)); }

}

/* ---------------- Photo file naming ---------------- */
function orderedPhotos(ins) {
  const tabIdx = id => SECTIONS.findIndex(s => s.id === id);
  return [...ins.photos].sort((a, b) => tabIdx(photoTab(a)) - tabIdx(photoTab(b)) || (a.extra - b.extra) || a.ts - b.ts);
}
function sfrepNames(names) { const m = new Map(); names.forEach((v, k) => m.set(k, v.replace(/[^A-Za-z0-9.()-]+/g, '_'))); return m; }
function photoFileNames(ins) {
  const used = new Set(); const map = new Map();
  orderedPhotos(ins).forEach((p, i) => {
    let base = `${String(i + 1).padStart(3, '0')} ${safeName(p.label)}`; let n = base, k = 2;
    while (used.has(n.toLowerCase())) n = base + ' (' + k++ + ')';
    used.add(n.toLowerCase()); map.set(p.id, n + '.jpg');
  });
  return map;
}

/* ---------------- Readable notes (HTML for the workfile) ---------------- */
function notesHTML(ins, names, srcOf) {
  const issues = computeIssues(ins);
  const row = (l, v) => v ? `<tr><th>${esc(l)}</th><td>${esc(v)}</td></tr>` : '';
  const fieldRows = (fields, d) => fields.filter(f => !['photo', 'info', 'crs'].includes(f.t) && isShown(f, d, ins)).map(f => row(f.l, f.t === 'calc' ? String(f.calc(ins)) : f.t === 'review' ? (f.items(ins) || []).map(i => i.label + ': ' + (i.value || '—')).join('; ') : valText(f, d[f.k], d))).join('');
  const pics = list => list.length ? `<div class="pics">${list.map(p => `<figure><img src="${srcOf ? srcOf(p) : 'Photos/' + encodeURI(names.get(p.id))}" alt=""><figcaption>${esc(p.label)}</figcaption></figure>`).join('')}</div>` : '';
  let body = '';
  SECTIONS.forEach(sec => {
    let s = '';
    sec.groups.forEach(g => {
      const rows = fieldRows(g.fields, ins.data[sec.id]);
      let lst = '';
      if (g.list) ins.lists[g.list].forEach((it, i) => {
        const nm = LISTS[g.list].name(it, i, ins.lists[g.list]);
        lst += `<h4>${esc(nm)}</h4><table>${fieldRows(LISTS[g.list].fields, it)}${(g.list === 'kitchens' || g.list === 'baths') ? row('Quality comment (auto)', roomQualityComment(g.list, it)) : ''}</table>${pics(ins.photos.filter(p => p.list === g.list && p.item === it.id))}`;
      });
      const gp = ins.photos.filter(p => p.sec === sec.id && !p.extra && g.fields.some(f => f.k === p.field));
      if (rows || lst || gp.length) s += `<h3>${esc(g.title)}</h3>${rows ? `<table>${rows}</table>` : ''}${pics(gp)}${lst}`;
    });
    const ex = ins.photos.filter(p => p.sec === sec.id && p.extra);
    if (ex.length) s += `<h3>Workfile photos</h3>${pics(ex)}`;
    if (s) body += `<section><h2>${esc(sec.title)}</h2>${s}</section>`;
  });
  const sums = COMMENT_TARGETS.map(t => { const r = buildComment(ins, t); return r.text ? `<h3>${esc(t.title)} <small>${t.fid} · ${r.text.length}/${t.lim}</small></h3><p>${esc(r.text)}</p>${r.dropped.length ? `<p class="dropped">Not included in the UAD field (over limit): ${esc(r.dropped.join(' '))}</p>` : ''}` : ''; }).join('');
  const open = issues.filter(x => !ins.overrides[x.key]); const ovr = issues.filter(x => ins.overrides[x.key]);
  const p = ins.data.property;
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(insTitle(ins))} – Inspection Notes</title>
<style>body{font:15px/1.45 -apple-system,"Segoe UI",Arial,sans-serif;color:#12302f;max-width:960px;margin:0 auto;padding:24px 16px}h1{color:#066a70;margin:0}h2{background:#0b8f96;color:#fff;padding:8px 12px;border-radius:6px;margin:28px 0 8px;font-size:18px}h3{color:#066a70;margin:18px 0 6px;font-size:16px}h4{margin:14px 0 4px}table{border-collapse:collapse;width:100%}th,td{text-align:left;vertical-align:top;border-bottom:1px solid #d5e6e7;padding:5px 8px}th{width:38%;font-weight:600;color:#4b6766}.pics{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}figure{margin:0;width:220px}figure img{width:100%;border-radius:6px;border:1px solid #d5e6e7}figcaption{font-size:12px}.meta{color:#4b6766}.dropped{color:#c45f06;font-size:13px}small{color:#4b6766;font-weight:400}@media print{h2{break-after:avoid}figure{break-inside:avoid}}</style></head><body>
<h1>${esc(insTitle(ins))}</h1><p class="meta">${esc([p.addr, p.unit, p.city, p.state, p.zip].filter(Boolean).join(', '))}<br>County: ${esc(p.county || '')} · Inspected ${esc(p.inspDate || '')} · Exported ${new Date().toLocaleString()}<br>${ins.photos.length} photos · Inspection record ID ${ins.id}</p>
${body}
${crsNotes(ins)}${permitNotes(ins)}<section><h2>Measure for SFREP (from your sketch)</h2>${measureReminders(ins).length ? '<ul>' + measureReminders(ins).map(m => '<li>' + esc(m) + '</li>').join('') + '</ul>' : '<p>None.</p>'}</section>
${(ins.sketch && (ins.sketch.calcs || []).length) ? `<section><h2>Area calculations (from the sketch, ANSI Z765-2021)</h2>${ins.sketch.calcs.map(x => `<h4>${esc(x.code)} ${esc(x.name)} · ${esc(x.levelName || x.level)}</h4><table>${x.lines.map(l => `<tr><td>${esc(l.t)}</td><td style="text-align:right">${l.a.toFixed(1)}</td></tr>`).join('')}${x.less.map(k => `<tr><td>less ${esc(k.name)} (drawn inside)</td><td style="text-align:right">−${k.a.toFixed(1)}</td></tr>`).join('')}<tr><th>Total</th><th style="text-align:right">${x.net.toLocaleString()} sf</th></tr></table>`).join('')}</section>` : ''}
<section><h2>UAD commentary (as sent to SFREP)</h2>${sums || '<p>None.</p>'}</section>
<section><h2>Open items at export</h2>${open.length ? '<ul>' + open.map(x => `<li>${esc(x.sev)}: ${esc(x.label)}</li>`).join('') + '</ul>' : '<p>None.</p>'}
${ovr.length ? '<h3>Overridden in the field</h3><ul>' + ovr.map(x => `<li>${esc(x.label)} — ${esc(ins.overrides[x.key])}</li>`).join('') + '</ul>' : ''}</section>
</body></html>`;
}

/* ---------------- MISMO 3.6 XML (UAD subject inspection data) ---------------- */
class XN { constructor(tag, attrs) { this.tag = tag; this.attrs = attrs || {}; this.kids = []; this.text = null; } }
function X(parent, tag, attrs) { const n = new XN(tag, attrs); if (parent) parent.kids.push(n); return n; }

const SQFT = { AreaUnitOfMeasureType: 'SquareFeet' };
function xmlOut(n, ind = '') {
  const a = Object.entries(n.attrs).map(([k, v]) => ` ${k}="${esc(v)}"`).join('');
  if (n.text !== null) return `${ind}<${n.tag}${a}>${esc(n.text)}</${n.tag}>\n`;
  if (!n.kids.length) return n.selfClose ? `${ind}<${n.tag}${a}/>\n` : '';
  const inner = n.kids.map(k => xmlOut(k, ind + '\t')).join('');

  const out = [];

async function doExport(kind, btn) {
  const ins = app.ins; const old = btn.textContent; btn.disabled = true; btn.textContent = 'Building…';
  try {
    const names = photoFileNames(ins); const base = safeName(insTitle(ins) + ' ' + (ins.data.property.addr || ''));
    let blob, fname;
    if (kind === 'workfile') {
      const sNames = sfrepNames(names);
      const sfrepPhotos = ins.photos.filter(p => !p.extra || p.toReport); const inSfrep = new Set(sfrepPhotos.map(p => p.id));
      /* each photo once (Oct 20 2026: her workfile was 77 MB because every report photo was in Photos/ AND SFREP/Images/):
         report photos live in SFREP/Images (so the SFREP folder still imports on its own), workfile-only photos in Photos/ */
      const srcOf = p => inSfrep.has(p.id) ? 'SFREP/Images/' + encodeURI(sNames.get(p.id)) : 'Photos/' + encodeURI(names.get(p.id));
      const entries = [
        { name: 'Inspection Notes.html', data: notesHTML(ins, names, srcOf) },
        { name: 'inspection-backup.json', data: JSON.stringify({ app: 'uad36-inspect', version: 1, inspection: ins }) },
        ...(await photoEntries({ ...ins, photos: ins.photos.filter(p => !inSfrep.has(p.id)) }, names, 'Photos/')),
        ...(await originalEntries(ins, names, 'Photos – unblurred originals (workfile only)/')),
        { name: 'SFREP/' + base + '.xml', data: buildMISMO(ins, sNames) },
      ];
      for (const p of sfrepPhotos) { const rec = await DB.get('photos', p.id); if (rec) entries.push({ name: 'SFREP/Images/' + sNames.get(p.id), data: rec.blob }); }
      const skp = ins.photos.filter(p => p.sec === 'interior' && p.field === 'sketchImg').sort((a, b) => a.ts - b.ts); const pdfPages = [];
      for (const p of skp) { const rec = await DB.get('photos', p.id); if (rec && rec.blob && p.w && p.h) pdfPages.push({ bytes: new Uint8Array(await rec.blob.arrayBuffer()), w: p.w, h: p.h }); }
      if (pdfPages.length) entries.push({ name: 'Sketch.pdf', data: makePdf(pdfPages) });
      blob = await makeZip(entries); fname = base + ' – Workfile.zip';
    } else {
      const sNames = sfrepNames(names); const entries = [{ name: base + '.xml', data: buildMISMO(ins, sNames) }];
      for (const p of ins.photos.filter(p => !p.extra || p.toReport)) { const rec = await DB.get('photos', p.id); if (rec) entries.push({ name: 'Images/' + sNames.get(p.id), data: rec.blob }); }
      blob = await makeZip(entries); fname = base + ' – SFREP.zip';
    }
    const r = await deliver(blob, fname);
    if (r === 'shared' || r === 'downloaded') { ins.exported = Date.now(); save(); toast(r === 'shared' ? 'Exported' : 'Downloaded ' + fname); }
    else if (r === 'blocked') toast('This preview cannot save files. Use the installed app to export.');
  } catch (e) { console.error(e); toast('Export failed: ' + (e.message || e)); }
  btn.disabled = false; btn.textContent = old;
}

async function restoreBackup(file) {
  if (!file) return;
  try {
    const files = await readZip(file); const json = files.get('inspection-backup.json');
    if (!json) throw new Error('This zip has no inspection backup. Choose a Workfile package exported by this app.');
    const data = JSON.parse(new TextDecoder().decode(json)); const ins = normalize(data.inspection);
    const names = photoFileNames(ins); let n = 0;
    if (await DB.get('inspections', ins.id)) { ins.id = uid(); ins.data.property.fileName = insTitle(ins) + ' (restored copy)'; }
    for (const p of ins.photos) {
      const bytes = files.get('Photos/' + names.get(p.id)) || files.get('SFREP/Images/' + sfrepNames(names).get(p.id)); if (!bytes) continue;
      const blob = new Blob([bytes], { type: 'image/jpeg' }); const { thumb } = await processImage(new File([blob], 'p.jpg', { type: 'image/jpeg' }));
      const ob = files.get('Photos – unblurred originals (workfile only)/' + names.get(p.id));
      if (await DB.get('photos', p.id)) p.id = uid();
      await DB.put('photos', ob ? { id: p.id, insId: ins.id, blob, thumb, original: new Blob([ob], { type: 'image/jpeg' }) } : { id: p.id, insId: ins.id, blob, thumb }); n++;
    }
    await DB.put('inspections', ins); toast(`Restored with ${n} photos`); openInspection(ins.id);
  } catch (e) { toast(e.message || 'Could not restore that file'); }
}

<table>${P.zoning ? `<tr><th>Zoning</th><td>${esc(P.zoning)}</td></tr>` : ''}<tr><th>Parcel holds</th><td>${P.holds.length ? esc(P.holds.join(' / ')) : 'None shown'}</td></tr></table>
${items.length ? `<h3>Permits and cases</h3><table>${items.map(i => `<tr><th>${esc(i.date)}</th><td>${esc(i.what)} · ${esc(i.dept)}${i.status ? ' · ' + esc(i.status) : ''} · ${esc(i.num)}</td></tr>`).join('')}</table>` : ''}</section>`;
}
function crsNotes(ins) {
  const c = ins.data.property.crs; if (!c) return '';
  const r = (l, v) => v ? `<tr><th>${esc(l)}</th><td>${esc(v)}</td></tr>` : '';
  return `<section><h2>Public record (CRS Data, ${esc(c.loadedAt || '')})</h2><table>${r('Address', [c.addr, c.cityLine].join(', '))}${r('APN', c.apn)}${r('Owner of record', c.owner)}${r('Land use', c.landUse)}${r('Year built (assessor / MLS)', [c.yearBuilt, c.yearBuiltMls].filter(Boolean).join(' / '))}${r('Beds / baths (assessor)', [c.beds, c.baths].filter(Boolean).join(' / '))}${r('Public record sq. ft.', c.sqft)}${r('Lot size', [c.lotSf && c.lotSf + ' sq. ft.', c.acres && c.acres + ' ac.'].filter(Boolean).join(' / '))}${r('Latitude / longitude', c.lat ? c.lat + ', ' + c.lng : '')}${r('Census tract', c.census)}${r('FEMA flood zone', [c.fema, c.femaRisk, c.femaPanel, c.femaDate].filter(Boolean).join(' · '))}</table>
  ${(c.sales || []).length ? `<h3>Sales / transfer history</h3><table><tr><th>Date</th><td><b>Amount · Instrument · Buyer · Doc #</b></td></tr>${c.sales.map(x => `<tr><th>${esc(x.date)}</th><td>${esc([x.amount, x.instrument, x.buyer, x.doc].filter(Boolean).join(' · '))}</td></tr>`).join('')}</table>` : ''}
  ${(c.loans || []).length ? `<h3>Mortgage history</h3><table>${c.loans.map(x => `<tr><th>${esc(x.date)}</th><td>${esc([x.amount, x.lender, x.doc].filter(Boolean).join(' · '))}</td></tr>`).join('')}</table>` : ''}</section>`;
}

/* =====================================================================
   ✍ Help me write (Oct 20 2026, her ask): under each comment box. She types what she wants to say; Claude
   rewrites it so it reads well and fits UAD 3.6 and USPAP, with no biased wording – keeping every fact she gave
   and adding none. She reads the suggestion and picks "Use this" or "Keep mine"; nothing is replaced on its own.
   Her rules: AI only per the order's AI setting (No AI = nothing is sent; Redacted = names, phones and e-mails
   are taken out first); her own comment library (no order) sends only the text in the box, phones and e-mails removed.
   Shared by the Appraisal Assistant (hub) and the Comp genie – same file in both builds.
   ===================================================================== */
const HW_SEL = [
  // hub
  'textarea[data-ce="text"]', 'textarea[data-mk="comment"]', 'textarea[data-mk="boundary"]', 'textarea[data-mk="criteria"]', 'textarea[data-mcx="summary"]', '#pbComment', '#f_ea', '#f_hc', '#f_extra', '#f_rightsNot',
  // iPad inspection app: the section summaries (your added comment, or the final wording when you edit it)
  'textarea[data-comment]', 'textarea[data-final]',
  // comp genie
  '#drText', 'textarea[data-gnote]', 'textarea[data-landc]', 'textarea[data-ck="comment"]', 'textarea[data-ik="comment"]', 'textarea[data-rpt="reconNote"]', 'textarea[data-rpt="hbuNote"]', 'textarea[data-rpt="sowNote"]', 'textarea[data-rpt="priorSvcText"]', 'textarea[data-rpt="addlCondText"]', 'textarea[data-rpt="rightsNot"]'].join(',');
const HW_BIAS = /\b(pride of ownership|desirable|undesirable|safe (?:area|neighborhood|community|street)|unsafe|crime|dangerous|exclusive|prestigious|upscale|elite|family[- ]friendly|young famil(?:y|ies)|kids|singles|retirees|elderly|seniors|church\w*|synagogue|mosque|ethnic\w*|integrated|diverse|master (?:bed(?:room)?|bath|suite)|man cave|handicap(?:ped)?|wheelchair[- ]bound|good (?:neighborhood|area|location)|bad (?:neighborhood|area)|neighborhood)\b/gi;
const hwKey = () => { try { return localStorage.getItem('aa.claudeKey') || ''; } catch (e) { return ''; } };
const hwModel = () => { let m = ''; try { m = localStorage.getItem('aa.claudeModel') || ''; } catch (e) {} m = m.trim().toLowerCase().replace(/[\s.]+/g, '-').replace(/-+/g, '-'); return m || 'claude-sonnet-5-5'; };
function hwOrderAi(ta) {   // 'Yes' | 'Redacted' | 'No' | 'library'
  if (ta.matches('textarea[data-ce="text"]')) return 'library';
  try { if (typeof cur !== 'undefined' && cur && document.getElementById('f_fileNo')) return cur.aiUse || ''; } catch (e) {}
  try { if (typeof app !== 'undefined' && app.job && typeof orderOf === 'function') { const o = orderOf(app.job); return (o && o.aiUse) || ''; } } catch (e) {}
  try { if (typeof app !== 'undefined' && app.ins && app.ins.data) { const O = (app.ins.data.property || {}).order; return (O && O.aiUse) || ''; } } catch (e) {}   // iPad: the order's AI setting came with the order
  return '';
}
function hwScrub(t, mode) {
  let s = String(t || '').replace(/[\w.+-]+@[\w-]+\.[\w.]+/g, '[e-mail removed]').replace(/\(?\b\d{3}\)?[\s.-]?\d{3}[\s.-]\d{4}\b/g, '[phone removed]');
  if (mode === 'Redacted') { try { if (typeof redactText === 'function' && typeof cur !== 'undefined' && cur) s = redactText(s); } catch (e) {} }
  return s;
}
function hwWhat(ta) {   // which comment it is, so the wording fits
  const lab = ta.closest('label, .fld, .field, section, .card, details'); const h = lab && lab.querySelector('span, b, h2, h3, summary');
  const k = ta.id || Object.entries(ta.dataset).map(([a, b]) => a + '=' + b).join(' ');
  const def = (HW_FIELDS.find(([sel]) => { try { return ta.matches(sel); } catch (e) { return false; } }) || [])[1];
  return (def ? def + ' ' : '') + '(on screen: ' + ((h && h.textContent) || '').replace(/\s+/g, ' ').trim().slice(0, 100) + (k ? ' [' + k + ']' : '') + ')';
}
/* what each box is in UAD 3.6 and what is reported elsewhere (so Claude does not ask her to repeat it) */
const HW_FIELDS = [
  ['textarea[data-mk="criteria"]', '17.004 Search Criteria Description (1,250 characters): the criteria used to find the competing properties within the market area boundary – MLS, property type, area/district, date range, size, quality, condition and any other filters. The counts, price ranges, days on market and list/sale figures are reported in the Search Result Metrics (17.005–17.016); the boundary is in 17.003 Market Area Boundary – do not add or ask for them here.'],
  ['textarea[data-mk="boundary"]', '17.003 Market Area Boundary (1,250 characters): the streets, landmarks or natural features that bound the market area. Not the search criteria or the results.'],
  ['textarea[data-mk="comment"]', '17.019 Price Trend Analysis Commentary (2,500 characters): how the price trend was analyzed and concluded (increasing / stable / declining) and its support. The sources are listed in 17.018 Price Trend Source; the counts and medians are in the Search Result Metrics. Her rule: price per square foot is not a measure of a price trend.'],
  ['textarea[data-mcx="summary"]', 'Form 1004MC summary (UAD 2.6 Market Conditions Addendum): summarize the market conditions shown by the 1004MC figures.'],
  ['#pbComment', 'Permit history comment: what the permit records show, by owner, newest first. Facts only.'],
  ['#f_ea', 'Extraordinary assumption(s) (USPAP): state the assumption, why it is needed, and that its use might affect the assignment results.'],
  ['#f_hc', 'Hypothetical condition(s) (USPAP): state the condition contrary to fact, why it is used, and that its use might affect the assignment results.'],
  ['#f_rightsNot, textarea[data-rpt="rightsNot"]', 'Rights not included in the appraisal (540 characters).'],
  ['#drText', 'Sales Comparison Approach commentary (UAD 3.6): why the comparables were selected, the adjustments and their support, and the range and reconciliation of the adjusted prices. The grid itself is reported separately.'],
  ['textarea[data-comment]', 'iPad section summary – her added comment, placed after the automatic checkbox summary of that UAD 3.6 section (view, site, exterior, interior, ADU, outbuilding, functional, vehicle storage, amenities, energy, disaster mitigation …); the summary already states the checked items, so do not repeat them.'], ['textarea[data-final]', 'iPad section summary – the final wording of that UAD 3.6 section commentary (it replaces the automatic summary); keep every fact she wrote.'], ['textarea[data-gnote]', 'Sales comparison grid note.'], ['textarea[data-ik="comment"]', 'Income Approach – Income Analysis Comment (5,000 characters): comparable rentals and the subject market rent, the GRM from rented sales, the indicated value, and the weight given (single-family homes are mostly owner-occupied).'], ['textarea[data-ck="comment"]', 'Cost Approach – Cost Analysis Comment (5,000 characters): source of cost new (her local contractor budgets, CCCI-indexed; BOE AH 531 check), cost type and method, depreciation (age-life: effective age / economic life), functional and external obsolescence, site improvements as is, and the weight given to the approach.'], ['textarea[data-landc]', 'Cost Approach – Site Estimated Value Comment (2,500 characters): how the site value was estimated (the land sales and their range).'],
  ['textarea[data-rpt="reconNote"]', 'Reconciliation commentary: the weight given to each approach and why, leading to the final opinion of value.'],
  ['textarea[data-rpt="hbuNote"]', 'Highest and Best Use commentary: the four tests (legally permissible, physically possible, financially feasible, maximally productive) as improved.'],
  ['textarea[data-rpt="sowNote"]', 'Assignment Information and Scope of Work commentary.'], ['textarea[data-rpt="priorSvcText"]', 'Prior services disclosure (1,250 characters): services performed regarding the subject within the three years before acceptance of the assignment.'],
  ['textarea[data-rpt="addlCondText"]', 'Additional client-requested conditions.'], ['textarea[data-ce="text"]', 'A comment for her own comment library.']];
const HW_SYS = `You help Jennifer, a California certified residential appraiser in Santa Barbara County, word comments for UAD 3.6 (redesigned URAR, Fannie Mae / Freddie Mac) reports. She is the expert: she knows UAD 3.6, USPAP and her market.
Rewrite her draft so it reads clearly and professionally in HER style. Rules:
- Keep every fact, number, date, rating and conclusion she wrote. Never add facts, numbers, adjustments, opinions or conclusions she did not state.
- Her vocabulary – keep it, never "correct" it: SBMLS (Santa Barbara MLS; never spell it out), Flexmls, Home/Estate (HE), district numbers, "market area" (never "neighborhood"), "finished area above grade" / "below grade" and "ANSI Z765" (UAD 3.6 terms; do not change them to GLA), Q1–Q6 and C1–C6 UAD ratings with her tiers written as she writes them ("high Q4", "low C3", "Q4+", "C3-"; a tier is her own refinement of the UAD rating – keep it, do not question it), "primary bedroom", "the appraiser", "effective date", "look-back period", "competing properties", "macro market area" (market area boundary search) and "micro market" (search criteria / competing properties).
- UAD 3.6 puts many facts in their own fields (counts, price ranges, days on market, boundaries, sources, ratings, sizes). Write only what belongs in THIS box (its definition is given). Do not add or ask for facts that have their own field.
- Plain, factual, objective wording that complies with USPAP: no advocacy, no guarantees, no marketing language, no exclamation marks, third person. Short sentences. Keep her order of ideas.
- No biased or subjective wording and nothing about protected classes (race, color, religion, national origin, sex, familial status, disability, age): never desirable, pride of ownership, safe, crime, exclusive, prestigious, upscale, family-friendly, master bedroom.
- Stay within the character limit.
"check": at most 3 items, only things genuinely required for THIS box by UAD 3.6 or USPAP that her draft leaves out, or a real inconsistency inside her draft. Never ask her to define her standard abbreviations or tiers, to confirm a term above, or to add something that has its own UAD field. Usually "check" is empty.
Reply with JSON only: {"text": "the rewritten comment", "changes": ["short note of what you changed"], "check": []}`;
async function hwRun(ta, box) {
  const draft = ta.value.trim(); const say = (h, cls) => { box.innerHTML = `<div class="hw-msg ${cls || ''}">${h}</div>`; };
  if (!draft) return say('Type what you want to say first, in your own words – then tap Help me write.');
  const mode = hwOrderAi(ta);
  if (mode === 'No') return say('This order is set to <b>No AI</b>, so nothing is sent. Change the order’s AI use to Yes or Redacted to use Help me write.', 'warn');
  if (!hwKey()) { if (typeof app !== 'undefined' && app.ins) { say(`No Claude key on this iPad yet. Paste it once (the same key as on your computer – Appraisal Assistant › Standard wording › AI settings). It stays on this iPad only.<div class="hw-row" style="margin-top:6px"><input type="password" class="txt hw-key" placeholder="sk-ant-…" style="flex:1;min-width:200px"><button type="button" class="btn sm hw-keysave">Save key</button></div>`, 'warn');
      const b = box.querySelector('.hw-keysave'); if (b) b.onclick = () => { const v = (box.querySelector('.hw-key').value || '').trim(); if (!/^sk-/.test(v)) { alert('That does not look like a Claude key (it starts with sk-).'); return; } try { localStorage.setItem('aa.claudeKey', v); } catch (e) {} hwRun(ta, box); }; return; }
    return say('No Claude key is saved on this computer. Add it in the Appraisal Assistant › Standard wording › AI settings.', 'warn'); }
  if (typeof navigator !== 'undefined' && navigator.onLine === false) return say('No internet here – Help me write needs a connection. Your draft is saved; try again when you have signal.', 'warn');
  const lim = +ta.getAttribute('maxlength') || 0; const text = hwScrub(draft, mode);
  say('Claude is writing…');
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': hwKey(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: hwModel(), max_tokens: 2000, system: HW_SYS + (hwRules() ? '\nHer own standing rules (follow them):\n' + hwRules() : ''), messages: [{ role: 'user', content: `Comment box: ${hwWhat(ta)}\nCharacter limit: ${lim || 'none stated (keep it as short as the content allows)'}\n\nHer draft:\n${text}` }] }) });
    const j = await res.json(); if (!res.ok) throw new Error((j.error && j.error.message) || 'Claude answered with an error (' + res.status + ')');
    const out = (j.content || []).filter(c => c.type === 'text').map(c => c.text).join(''); const J = JSON.parse(out.slice(out.indexOf('{'), out.lastIndexOf('}') + 1));
    let t = String(J.text || '').trim(); if (!t) throw new Error('no text came back');
    const flags = [...new Set((t.match(HW_BIAS) || []).map(x => x.toLowerCase()))];
    box.innerHTML = `<div class="hw-out"><b>Suggested wording</b> <small>${t.length.toLocaleString()}${lim ? ' / ' + lim.toLocaleString() : ''} characters – read it and change anything before you use it</small>
      <textarea class="txt hw-txt" rows="${Math.min(14, 3 + Math.round(t.length / 95))}">${hwEsc(t)}</textarea>
      ${flags.length ? `<p class="hw-msg warn">Check these words: ${flags.map(hwEsc).join(', ')}</p>` : ''}${lim && t.length > lim ? `<p class="hw-msg warn">Over the ${lim.toLocaleString()} character limit – shorten it before you use it.</p>` : ''}
      ${(J.changes || []).length ? `<details><summary>What was changed</summary><ul>${J.changes.map(x => `<li>${hwEsc(x)}</li>`).join('')}</ul></details>` : ''}
      ${(J.check || []).length ? `<div class="hw-check"><b>You may want to check or add:</b><ul>${J.check.map(x => `<li>${hwEsc(x)}</li>`).join('')}</ul></div>` : ''}
      <div class="hw-row"><button type="button" class="btn primary sm hw-use">Use this</button><button type="button" class="btn sm hw-keep">Keep mine</button><button type="button" class="btn sm ghost hw-again">Try again</button></div></div>`;
    box.querySelector('.hw-use').onclick = () => { const v = box.querySelector('.hw-txt').value; ta.value = lim ? v.slice(0, lim) : v; ['input', 'change'].forEach(ev => ta.dispatchEvent(new Event(ev, { bubbles: true }))); box.innerHTML = '<div class="hw-msg ok">✓ Your comment box has the new wording. Read it once more before it goes in the report.</div>'; };
    box.querySelector('.hw-keep').onclick = () => { box.innerHTML = ''; };
    box.querySelector('.hw-again').onclick = () => hwRun(ta, box);
  } catch (e) { say('Help me write did not work: ' + hwEsc(e.message || String(e)), 'warn'); }
}
const hwRules = () => { try { return localStorage.getItem('aa.hwRules') || ''; } catch (e) { return ''; } };
function hwRulesUI(box) {
  box.innerHTML = `<div class="hw-out"><b>My writing rules</b> <small>one per line – used every time Help me write runs (kept on this computer)</small>
    <textarea class="txt hw-rules" rows="6" placeholder="e.g. Write SBMLS, never spell it out.&#10;Use “high Q4” / “low C3” for my tiers.&#10;Do not list the number of sales – it is in the Search Result Metrics.">${hwEsc(hwRules())}</textarea>
    <div class="hw-row"><button type="button" class="btn primary sm hw-rsave">Save my rules</button><button type="button" class="btn sm hw-keep">Close</button></div></div>`;
  box.querySelector('.hw-rsave').onclick = () => { try { localStorage.setItem('aa.hwRules', box.querySelector('.hw-rules').value.trim()); } catch (e) {} box.innerHTML = '<div class="hw-msg ok">✓ Saved – Help me write follows these from now on.</div>'; };
  box.querySelector('.hw-keep').onclick = () => { box.innerHTML = ''; };
}
const hwEsc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function hwAttach(root) {
  (root || document).querySelectorAll(HW_SEL).forEach(ta => { if (ta.dataset.hw) return; ta.dataset.hw = '1';
    const wrap = document.createElement('div'); wrap.className = 'hw'; wrap.innerHTML = '<button type="button" class="btn sm hw-btn" title="Type what you want to say, then tap: Claude suggests clearer, UAD 3.6 / USPAP wording with no biased words. You decide whether to use it.">✍ Help me write</button> <button type="button" class="btn sm ghost hw-rbtn" title="Your standing rules for Help me write">My writing rules</button><div class="hw-box"></div>';
    ta.insertAdjacentElement('afterend', wrap); wrap.querySelector('.hw-btn').onclick = () => hwRun(ta, wrap.querySelector('.hw-box')); wrap.querySelector('.hw-rbtn').onclick = () => hwRulesUI(wrap.querySelector('.hw-box')); });
}
if (typeof document !== 'undefined') {
  const st = document.createElement('style'); st.textContent = `.hw{margin:6px 0 10px}.hw-btn{background:#f3ecff;border-color:#7b5cc4;color:#3d2a7a}.hw-msg{font-size:14px;margin:6px 0;padding:6px 10px;border-radius:8px;background:#f5f5f5}.hw-msg.warn{background:#fff1e0;color:#8a4500}.hw-msg.ok{background:#eefbf3;color:#0a4d27}
.hw-out{border:2px solid #7b5cc4;border-radius:10px;padding:10px 12px;margin-top:6px;background:#fbf9ff}.hw-out textarea{width:100%;margin:6px 0}.hw-row{display:flex;gap:8px;flex-wrap:wrap}.hw-check{font-size:14px;background:#fffbe6;border-radius:8px;padding:6px 10px;margin:6px 0}.hw-check ul,.hw-out ul{margin:4px 0;padding-left:20px}`;
  (document.head || document.documentElement).appendChild(st);
  const go = () => { hwAttach(document); new MutationObserver(() => hwAttach(document)).observe(document.body, { childList: true, subtree: true }); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else setTimeout(go, 0);
}

/* ---------------- Boot ---------------- */
function showFatal(msg, where) {
  const root = document.getElementById('app'); if (!root || document.getElementById('fatal')) return;
  const box = document.createElement('div'); box.id = 'fatal'; box.className = 'fatal';
  box.innerHTML = `<h2>Something went wrong</h2><p>Your inspections are still saved on this iPad. <b>Do not delete the app icon</b> – that would erase them.</p>
    <p class="fatal-msg">${esc(String(msg || 'Unknown error'))}${where ? ' · ' + esc(where) : ''}</p>
    <div class="row"><button class="btn primary" id="fatalHome">Go to my inspections</button><button class="btn" id="fatalReload">Reload app</button></div>
    <p class="help">Take a screenshot of this box and send it to Claude.</p>`;
  root.prepend(box); window.scrollTo(0, 0);
  box.querySelector('#fatalHome').onclick = async () => { try { await saveNow(); } catch (e) {} box.remove(); renderHome(); };
  box.querySelector('#fatalReload').onclick = () => location.reload();
}
window.addEventListener('error', e => { if (!e.message || e.message === 'Script error.' || /ResizeObserver/.test(e.message)) return; showFatal(e.message, (e.filename ? 'line ' + e.lineno : '')); });
window.addEventListener('unhandledrejection', e => showFatal(e.reason && (e.reason.message || e.reason), 'promise'));

(async function boot() {
  try { hcInit(); } catch (e) {}
  try { if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|anthropic/.test(location.host)) navigator.serviceWorker.register('sw.js'); } catch (e) {}
  const msg = document.getElementById('bootMsg'); if (msg) msg.textContent = 'Opening saved inspections…';
  // never wait forever on storage
  const ok = await Promise.race([DB.ready, new Promise(r => setTimeout(() => r('timeout'), 15000))]);
  if (ok !== true) {
    $('#app').innerHTML = `<div class="fatal"><h2>The iPad's storage is not responding</h2><p>Your inspections are still saved. <b>Do not delete the app icon.</b></p>
      <p>Close the app fully (swipe up and flick it away), wait 10 seconds and open it again. If this keeps happening, restart the iPad.</p>
      <div class="row"><button class="btn primary" onclick="location.reload()">Try again</button></div></div>`;
    return;
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
  try { if (typeof APP_CFG !== 'undefined' && APP_CFG.test) { document.documentElement.classList.add('testcopy'); const f = document.createElement('div'); f.className = 'testflag'; f.textContent = 'TEST COPY – separate storage, not for real inspections · version ' + (typeof BUILD !== 'undefined' ? BUILD : '?'); document.body.prepend(f); } } catch (e) {}
  const q = new URLSearchParams(location.search); const openId = q.get('open');
  if (openId) { history.replaceState(null, '', location.pathname); const rec = await DB.get('inspections', openId); if (rec) { openInspection(openId, q.get('tab')); return; } }
  renderHome();
})();
