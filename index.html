<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inspect TEST">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-512.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: white top bar with a tangerine rule + black tab strip, one column of folding subsections.
   Palette for direct sun: pure white page, black text, every fill carries dark text and a black edge.
   Mint = required, powder blue = optional, red = missing, neon lime = done,
   highlighter yellow = where you are, tangerine = what you picked / what you're working on, lilac = camera. */
:root {
  --bg: #ffffff;
  --ink: #000000;
  --ink-2: #1c1c1c;
  --line: #000000;
  --soft: #f2f2f2;
  --bar: #ffffff;
  --tabbar: #000000;
  --tangerine: #ff8a00;
  --cyan: #ffb25c;
  --cyan-dk: #b35a00;
  --lime: #b4ff2e;
  --pink: #d9c6ff;
  --yellow: #fff200;
  --req: #c4f2d6;
  --req-ink: #0a4d27;
  --req-lt: #eefbf3;
  --opt: #a9cdf5;
  --opt-ink: #0b3570;
  --warn: #e00000;
  --warn-lt: #ffe1e1;
  --focus: #ff8a00;
  --go: #0fa84a;
  --font: "Atkinson Hyperlegible", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
  --bw: 3px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
#app:has(> header.bar) { padding-top: var(--barh, 130px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 19px/1.4 var(--font); -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* ---------- Top bar ---------- */
/* fixed (not sticky) so it never slides away when iOS scrolls or the keyboard opens; #app is padded by its height */
.bar { position: fixed; top: 0; left: 0; right: 0; padding-top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); color: var(--ink); border-bottom: 5px solid var(--tangerine); }
.bar-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; min-height: 60px; flex-wrap: wrap; }
.bar .title { flex: 1; min-width: 160px; }
.bar .title b { display: block; font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .title span { display: block; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { background: #fff; border: 3px solid #000; color: #000; border-radius: 8px; padding: 8px 12px; font-weight: 700; font-size: 16px; min-height: 46px; display: inline-flex; align-items: center; }
.saved { font-size: 15px; font-weight: 700; white-space: nowrap; background: #fff; border: 2px solid #000; border-radius: 6px; padding: 4px 8px; }
.attn-pill { background: var(--warn); color: #fff; border: 3px solid #000; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 16px; white-space: nowrap; min-height: 46px; }
.attn-pill.ok { background: var(--lime); color: #000; }
.hc-btn[aria-pressed="true"] { background: var(--yellow); }

.tabs { display: flex; gap: 2px; overflow-x: auto; padding: 0 8px; background: var(--tabbar); scrollbar-width: none; scroll-behavior: smooth; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: transparent; color: #fff; padding: 13px 14px 10px; font-weight: 700; font-size: 17px; border-bottom: 6px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--yellow); border-bottom-color: var(--yellow); background: #262626; text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 2px; }
.tab .dot { display: inline-block; min-width: 22px; height: 22px; line-height: 22px; border-radius: 11px; background: var(--warn); color: #fff; font-size: 13px; text-align: center; margin-left: 6px; padding: 0 6px; }
.tab .dot.done { background: var(--go); color: #fff; border: 2px solid #fff; }

main { max-width: 1080px; margin: 0 auto; padding: 14px 16px 140px; }

/* ---------- Legend / next missing ---------- */
.legend { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 0 0 14px; }
.lg { font-size: 15px; font-weight: 700; padding: 6px 10px; border-radius: 6px; border: 2px solid #000; }
.lg.req { background: var(--req); color: var(--req-ink); }
.lg.opt { background: var(--opt); color: var(--opt-ink); }
.lg.warn { background: var(--warn); color: #fff; min-height: 44px; font-size: 16px; }
.lg.warn:disabled { background: var(--lime); color: #000; }

/* ---------- Folding subsections ---------- */
.group { background: var(--bg); border: var(--bw) solid var(--line); border-radius: var(--r); margin-bottom: 14px; overflow: clip; scroll-margin-top: 140px; }
.ghead { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--soft); border: 0; text-align: left; font-weight: 700; color: #000; min-height: 64px; }
.ghead.static { background: #000; color: #fff; }
.group.open > .ghead { background: #000; color: #fff; }
.group.current > .ghead { background: var(--yellow); color: #000; border-bottom: 3px solid #000; }
.ghead .chev { font-size: 22px; width: 22px; }
.ghead .gtitle { font-size: 22px; letter-spacing: .01em; flex: 1; text-transform: uppercase; }
.ghead .count { font-size: 15px; font-weight: 700; }
.gstat { font-size: 14px; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 2px solid #000; white-space: nowrap; }
.gstat.miss { background: var(--warn); color: #fff; }
.gstat.ok { background: var(--lime); color: #000; }
.gfoot { padding: 14px 16px; border-top: 3px solid #000; background: var(--soft); display: flex; justify-content: flex-end; }
.btn.done { background: var(--lime); border-color: #000; color: #000; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 6px var(--tangerine) inset; } 100% { box-shadow: none; } }

/* ---------- Fields ---------- */
.fields { display: grid; grid-template-columns: 1fr; }
.field { padding: 12px 16px 14px 22px; border-bottom: 2px solid #c8c8c8; position: relative; min-width: 0; scroll-margin-top: 150px; }
.field:last-child { border-bottom: 0; }
.field::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: var(--opt); }
.field.req::before { background: var(--req); }
.field.missing::before { background: var(--warn); }
.field.missing { background: #fff; }
.flabel { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; font-weight: 700; font-size: 19px; }
.flabel .tag { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; background: var(--opt); color: var(--opt-ink); }
.field.req .flabel .tag { background: var(--req); color: var(--req-ink); }
.field.missing .flabel .tag { background: var(--warn); color: #fff; }
.flabel .fid { font-family: var(--mono); font-size: 13px; color: var(--ink-2); font-weight: 400; }
.pcount { background: var(--lime); color: #000; border: 2px solid #000; border-radius: 999px; padding: 2px 10px; font-size: 14px; }
.help { font-size: 16px; color: var(--ink-2); margin: -4px 0 8px; }
.calc { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.calc-text { font-size: 17px; font-weight: 700; background: var(--soft); border: 2px solid #000; border-radius: 8px; padding: 10px 12px; }
.info { background: var(--soft); color: #000; font-size: 16px; padding: 10px 14px; border-radius: 8px; border: 2px solid #000; font-weight: 700; }
.info.remind { background: var(--yellow); }
.note-field::before { display: none; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: var(--bw) solid #000; background: #fff; border-radius: 8px; padding: 10px 15px; min-height: 52px; font-size: 18px; line-height: 1.2; display: inline-flex; align-items: center; gap: 9px; text-align: left; color: #000; }
.chip .box { width: 24px; height: 24px; border: 3px solid #000; border-radius: 4px; flex: none; display: grid; place-items: center; background: #fff; }
.chip.radio .box { border-radius: 50%; }
.chip[aria-pressed="true"] { background: var(--cyan); font-weight: 700; box-shadow: 0 0 0 2px #000 inset; }
.chip[aria-pressed="true"] .box { background: #000; }
.chip[aria-pressed="true"] .box::after { content: ""; width: 10px; height: 5px; border: 3px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px,-1px); }
.chip.radio[aria-pressed="true"] .box::after { width: 10px; height: 10px; border: 0; background: #fff; border-radius: 50%; transform: none; }
.yn .chip { min-width: 104px; justify-content: center; }

input.txt, select.txt, textarea.txt { width: 100%; border: var(--bw) solid #000; border-radius: 8px; padding: 11px 12px; background: #fff; min-height: 52px; font-size: 19px; color: #000; }
input.txt:focus, select.txt:focus, textarea.txt:focus { outline: 4px solid var(--focus); outline-offset: 0; }
input.num { max-width: 240px; font-variant-numeric: tabular-nums; }
textarea.txt { min-height: 100px; resize: vertical; line-height: 1.45; }
.limit { font-size: 15px; color: var(--ink-2); text-align: right; margin-top: 4px; font-variant-numeric: tabular-nums; font-weight: 700; }
.limit.over { color: var(--warn); }

.stepper { display: inline-flex; align-items: center; border: var(--bw) solid #000; border-radius: 8px; overflow: hidden; }
.stepper button { width: 58px; height: 52px; border: 0; background: var(--soft); font-size: 28px; font-weight: 700; color: #000; }
.stepper output { min-width: 66px; text-align: center; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- Appliances ---------- */
.chip.appl-on { background: var(--cyan); }
.appl-edit { flex-basis: 100%; margin: 2px 0 6px; border: 3px solid #000; border-radius: 10px; padding: 12px; background: var(--yellow); display: grid; gap: 10px; }
.appl-title { font-size: 20px; font-weight: 700; }
.appl-edit .row { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- Photos ---------- */
.photo-slot { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
.cam { display: inline-flex; align-items: center; gap: 8px; border: 3px solid #000; color: #000; background: var(--pink); border-radius: 10px; padding: 12px 18px; min-height: 58px; font-weight: 700; font-size: 18px; position: relative; overflow: hidden; }
.cam input { position: absolute; inset: 0; opacity: 0; font-size: 0; cursor: pointer; }
.cam.lib { background: #fff; }
.cam svg { width: 24px; height: 24px; flex: none; }
.thumb { width: 140px; border-radius: 8px; overflow: hidden; border: 3px solid #000; background: var(--soft); padding: 0; text-align: left; }
.thumb img { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; max-width: 100%; }
.thumb span { display: block; font-size: 14px; font-weight: 700; padding: 5px 7px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb.req { border-color: var(--req); }
.group.extra { border-style: dashed; }
.extra-photos { padding: 14px 16px; background: var(--soft); display: flex; flex-direction: column; gap: 10px; }
.extra-photos h3 { font-size: 17px; text-transform: uppercase; letter-spacing: .04em; display: flex; gap: 10px; align-items: center; }

/* ---------- Lists (rooms, baths, etc.) ---------- */
.item { border-top: 3px solid #000; }
.item-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #fff; flex-wrap: wrap; }
.item.open > .item-head { background: #ffdcb5; }
.item-head .name { flex: 1; min-width: 200px; font-weight: 700; font-size: 20px; color: #000; border: 0; background: none; text-align: left; padding: 8px 0; }
.item-head .name small { font-weight: 700; color: var(--ink-2); font-size: 15px; margin-left: 10px; }
.item-head .badge { font-size: 14px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--warn); color: #fff; border: 2px solid #000; white-space: nowrap; }
.item-head .badge.ok { background: var(--lime); color: #000; }
.item-body { border-left: 8px solid var(--cyan); margin-left: 0; }
.btn { border: 3px solid #000; background: #fff; border-radius: 8px; padding: 10px 16px; font-weight: 700; min-height: 50px; font-size: 18px; color: #000; display: inline-flex; align-items: center; justify-content: center; }
.btn.primary { background: var(--tangerine); }
.btn.cyan { background: var(--opt); }
.btn.danger { color: var(--warn); }
.btn.danger.solid { background: var(--warn); color: #fff; }
.btn.sm { padding: 6px 12px; min-height: 44px; font-size: 16px; }
.add-row { padding: 14px 16px; display: flex; gap: 10px; flex-wrap: wrap; border-top: 3px solid #000; background: var(--soft); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--warn-lt); color: var(--warn); font-weight: 700; border-top: 2px solid var(--warn); }

/* ---------- CRS ---------- */
.crs { display: grid; gap: 12px; }
.crs-btn { position: relative; overflow: hidden; justify-self: start; }
.crs-btn input { position: absolute; inset: 0; opacity: 0; font-size: 0; cursor: pointer; }
.crs-loaded { font-weight: 700; background: var(--lime); border: 2px solid #000; border-radius: 6px; padding: 6px 10px; justify-self: start; font-size: 16px; }
.crs-table { border-collapse: collapse; width: 100%; font-size: 17px; }
.crs-table th, .crs-table td { text-align: left; vertical-align: top; border-bottom: 2px solid #c8c8c8; padding: 6px 8px; }
.crs-table th { width: 40%; }

/* ---------- Home ---------- */
.new-form { background: #fff; border: 3px solid #000; border-radius: var(--r); padding: 16px; display: grid; gap: 12px; grid-template-columns: 1fr; margin-bottom: 22px; box-shadow: 8px 8px 0 var(--tangerine); }
.new-form h2 { font-size: 22px; }
.new-form .flabel .tag { background: var(--req); color: var(--req-ink); }
.cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.card { border: 3px solid #000; border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 8px; background: #fff; text-align: left; }
.card b { font-size: 20px; }
.card .meta { font-size: 16px; color: var(--ink-2); font-weight: 700; }
.card .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.prog { height: 12px; background: #ddd; border-radius: 6px; overflow: hidden; border: 2px solid #000; }
.prog i { display: block; height: 100%; background: var(--req); }

/* ---------- Attention ---------- */
.att { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-top: 2px solid #c8c8c8; flex-wrap: wrap; }
.att .sev { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 4px 8px; border-radius: 4px; flex: none; border: 2px solid #000; }
.sev.Required, .sev.Photo { background: var(--warn); color: #fff; }
.sev.Recommended { background: var(--tangerine); color: #000; }
.sev.Check { background: var(--yellow); color: #000; }
.att .what { flex: 1; min-width: 200px; font-weight: 700; }
.att .what small { display: block; color: var(--ink-2); font-size: 15px; }
.att.overridden { opacity: .6; }
.att .ovr { width: 100%; display: flex; gap: 8px; }
.att .ovr input { flex: 1; }

/* ---------- Summaries ---------- */
.sum { padding: 14px 16px; border-top: 2px solid #c8c8c8; display: grid; gap: 10px; }
.sum h3 { font-size: 19px; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.sum h3 .fid { font-family: var(--mono); font-size: 14px; color: var(--ink-2); font-weight: 400; }
.sum .auto { background: var(--soft); border: 2px solid #000; border-radius: 8px; padding: 12px; font-size: 18px; line-height: 1.5; white-space: pre-wrap; }
.sum .auto.empty { color: var(--ink-2); font-style: italic; }
.sum .dropped { font-size: 16px; color: #8a3b00; font-weight: 700; }
.sum .row, .exp .row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Gallery ---------- */
.gal-sec h3 { font-size: 18px; text-transform: uppercase; letter-spacing: .04em; padding: 14px 16px 6px; }
.gal { display: flex; flex-wrap: wrap; gap: 10px; padding: 6px 16px 16px; }
.missing-photos { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 14px; }
.missing-photos button { border: 3px solid var(--warn); background: var(--warn-lt); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 16px; font-weight: 700; }
.missing-photos button.sug { border-color: #000; background: #fff; color: #000; }

/* ---------- Sheets, jump, toast, undo ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; display: grid; place-items: center; padding: 16px; }
.sheet { background: #fff; border-radius: 14px; max-width: 760px; width: 100%; max-height: 92vh; overflow: auto; border: 3px solid #000; }
.sheet img { display: block; width: 100%; max-height: 60vh; object-fit: contain; background: #000; }
.sheet .body { padding: 16px; display: grid; gap: 12px; }
.sheet .row { display: flex; gap: 10px; flex-wrap: wrap; }
.sheet.jump { align-self: start; margin-top: 40px; }
.jump-list { display: grid; gap: 6px; max-height: 60vh; overflow: auto; }
.jump-item { text-align: left; border: 2px solid #000; background: #fff; border-radius: 8px; padding: 10px 14px; font-weight: 700; font-size: 18px; padding-left: 34px; }
.jump-item.top { background: #000; color: #fff; padding-left: 14px; }
.jump-item small { display: block; font-size: 14px; color: var(--ink-2); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #000; color: var(--yellow); padding: 14px 20px; border-radius: 10px; z-index: 60; font-weight: 700; max-width: calc(100% - 32px); font-size: 18px; border: 3px solid var(--yellow); }
.undo-bar { position: fixed; left: 16px; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 61; background: var(--yellow); border: 3px solid #000; border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-weight: 700; max-width: 760px; margin: 0 auto; }
.undo-bar span { flex: 1; min-width: 180px; }

.exp { padding: 16px; display: grid; gap: 12px; border-top: 2px solid #c8c8c8; }
.exp:first-of-type { border-top: 0; }
.exp h3 { font-size: 20px; }
.exp p { margin: 0; color: var(--ink-2); font-size: 17px; max-width: 65ch; }
.warn-box { background: var(--warn-lt); color: var(--warn); border: 2px solid var(--warn); border-radius: 8px; padding: 10px 14px; font-size: 17px; font-weight: 700; }

@media (min-width: 900px) {
  .fields.two { grid-template-columns: 1fr 1fr; }
  .fields.two .field.wide { grid-column: 1 / -1; }
  .new-form { grid-template-columns: 2fr 1fr auto; align-items: end; }
}

/* Outdoor mode: even heavier type and borders */
html.hc body { font-size: 21px; }
html.hc .chip { font-size: 20px; min-height: 58px; border-width: 4px; }
html.hc .flabel, html.hc .help, html.hc .chip { font-weight: 700; }
html.hc .field { border-bottom-color: #000; }
html.hc .group { border-width: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

.fatal { margin: 16px; padding: 18px 20px; border: 4px solid var(--warn); border-radius: 12px; background: #fff; color: #000; font-size: 19px; }
.fatal h2 { color: var(--warn); margin: 0 0 8px; }
.fatal-msg { font-family: ui-monospace, Menlo, monospace; font-size: 15px; background: #f2f2f2; padding: 8px 10px; border-radius: 6px; word-break: break-word; }

.rename { display: flex; gap: 8px; align-items: center; flex: 1; flex-wrap: wrap; }
.rename .txt { flex: 1; min-width: 200px; }

.review { display: grid; gap: 0; border: 2px solid #000; border-radius: 8px; overflow: hidden; }
.rv-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #bbb; flex-wrap: wrap; background: #fff; }
.rv-row:last-child { border-bottom: 0; }
.rv-l { font-weight: 700; min-width: 190px; }
.rv-v { flex: 1; min-width: 160px; }
.rv-v.empty { color: var(--warn); font-weight: 700; }

/* keep the open room's name in view while scrolling through it */
.item.open > .item-head { position: sticky; top: var(--barh, 120px); z-index: 6; border-bottom: 3px solid #000; }

/* pale fills need an edge to read in sun */
.flabel .tag, .lg.req, .lg.opt { border: 2px solid #000; }
.cam { font-weight: 700; }
.item.open > .item-head { background: #ffdcb5; }
.chip[aria-pressed="true"] .box { background: #000; }

/* stoplight check beside each subsection: grey until reviewed, green when reviewed with nothing missing */
.ghead-row { display: flex; align-items: stretch; background: var(--soft); }
.group.open > .ghead-row { background: #000; }
.group.current > .ghead-row { background: var(--yellow); border-bottom: 3px solid #000; }
.group.open > .ghead-row .ghead { background: transparent; color: inherit; }
.group.open > .ghead-row { color: #fff; } .group.current > .ghead-row { color: #000; }
.ghead-row .ghead { flex: 1; background: transparent; }
.gcheck { flex: none; width: 52px; height: 52px; margin: 6px 0 6px 10px; align-self: center; border-radius: 50%; border: 3px solid #000; background: #d9d9d9; color: #8a8a8a; font-size: 28px; font-weight: 900; line-height: 1; display: grid; place-items: center; padding: 0; }
.gcheck.on { background: var(--go); color: #fff; }

/* section footer: big "done" button with the same stoplight check */

.gcheck.sm { width: 42px; height: 42px; margin: 0; font-size: 24px; transition: background .2s, color .2s; }

.return-bar { position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 58; display: flex; gap: 10px; padding: 10px; background: #000; border-radius: 14px; border: 3px solid var(--yellow); }
.return-bar .ret-go { flex: 1; background: var(--yellow); color: #000; border: 3px solid #000; font-size: 20px; font-weight: 700; min-height: 60px; }

.testflag { background: #7b2cbf; color: #fff; font-weight: 700; text-align: center; padding: 4px; font-size: 14px; }
.sk-btn { background: #fff7d6; }

// Year pickers count back from the current year, so the list stays current every year
function yearOpts(from, remodel) {
  const now = new Date().getFullYear(); const out = [];
  for (let y = now; y >= from; y--) out.push([String(y), String(y)]);
  out.push(['Before ' + from, 'Before ' + from]);
  if (remodel) out.push(['Original', 'Original / never remodeled']);

}

function reviewItems(ins, rows) {
  return rows.map(([label, sec, k]) => {
    const { f, g } = findFieldIn(sec, k); const d = ins.data[sec] || {};
    if (!f || !isShown(f, d, ins)) return null;
    const value = valText(f, d[k], d); if (!value && !isReq(f, d, ins)) return null; // skip optional items left blank
    return { label, value, go: `${sec}|f-${sec}-${k}||${g ? g.id : ''}` };
  }).filter(Boolean);
}
function findFieldIn(secId, k) { const sec = SECTIONS.find(s => s.id === secId); if (sec) for (const g of sec.groups) for (const f of g.fields) if (f.k === k) return { f, g }; return {}; }
function pubrecItems(ins) {

  const fb = L.baths.filter(b => b.kind === 'FullBathroom').length, hb = L.baths.filter(b => b.kind === 'HalfBathroom').length;

  const S = ins && ins.sketch; if (!S || !S.totals) return [{ label: 'Sketch', value: '' }];
  const T = S.totals, f = n => (n || 0).toLocaleString() + ' sf', out = [];

/* ---------------- Storage (IndexedDB with memory fallback) ---------------- */
const DB = (() => {
  let db = null, closed = false; const mem = { inspections: new Map(), photos: new Map(), sketches: new Map() };
  const DB_NAME = (typeof APP_CFG !== 'undefined' && APP_CFG.db) || 'uad36-inspect';
  const wait = ms => new Promise(r => setTimeout(r, ms));
  // one attempt to open; resolves null if the iPad does not answer within ms
  const openOnce = ms => new Promise(res => {
    let done = false; const fin = v => { if (!done) { done = true; res(v); } };

    // Safari sometimes does not answer the first request after a page change: wake it up, then retry a few times
    try { if (indexedDB.databases) await Promise.race([indexedDB.databases(), wait(1500)]); } catch (e) {}
    for (let i = 0; i < 4 && !db; i++) { db = await openOnce(i ? 3000 : 2500); if (!db) await wait(300); }
    DB.step = db ? 'open' : 'open failed'; return !!db;
  };

  const tx = (store, mode, fn, ms = 6000) => new Promise((res, rej) => {
    if (closed) { rej(new Error('storage closed while leaving the page')); return; }
    if (!db) { res(fn(null)); return; }
    let t; try { t = db.transaction(store, mode); } catch (e) { rej(e); return; }

    // finish and close before switching pages, so the page being left cannot hold the storage

    async put(store, obj) { if (!db && !closed) { mem[store].set(obj.id, obj); return; } return tx(store, 'readwrite', s => s.put(obj)); },
    async get(store, id) { if (!db && !closed) return mem[store].get(id); return tx(store, 'readonly', s => s.get(id)); },
    async del(store, id) { if (!db && !closed) { mem[store].delete(id); return; } return tx(store, 'readwrite', s => s.delete(id)); },
    async all(store) { if (!db && !closed) return [...mem[store].values()]; return tx(store, 'readonly', s => s.getAll()); },
    async photosFor(insId) {
      if (!db && !closed) return [...mem.photos.values()].filter(p => p.insId === insId);
      return tx('photos', 'readonly', s => s.index('ins').getAll(insId));
    },
  };
  DB.ready = open();

})();

/* Build the final text for a comment target within its limit */
function buildComment(ins, target) {
  if (ins.finals[target.id] !== undefined && ins.finals[target.id] !== null) {
    const t = ins.finals[target.id]; return { text: t, dropped: [], edited: true, over: t.length > target.lim };
  }
  const gen = (GEN[target.id] ? GEN[target.id](ins) : []).filter(Boolean).filter(x => x.t && x.t !== '.');
  const user = (ins.comments[target.id] || '').trim();
  let keep = gen.map((g, i) => ({ ...g, i }));
  const join = arr => [arr.map(x => x.t).join(' '), user].filter(Boolean).join(' ');
  const dropped = [];
  while (join(keep).length > target.lim && keep.length) {
    let worst = keep.reduce((a, b) => (b.p > a.p || (b.p === a.p && b.i > a.i)) ? b : a);
    dropped.push(worst.t); keep = keep.filter(x => x !== worst);
  }
  let text = join(keep);
  const over = text.length > target.lim;
  return { text, dropped, edited: false, over };
}

/* Kitchen / bath quality comment (10.040), in the appraiser's style */
function roomQualityComment(listKey, it) {
  const parts = [];
  const cabTier = c => (c || []).includes('Custom Built') ? 'upgraded custom' : (c || []).includes('Semi-Custom') ? 'semi-custom' : (c || []).length ? 'standard' : '';

    const ct = cabTier(it.cab); if (ct) parts.push(ct + ' cabinetry');
    const br = brandList(it); const lux = br.filter(b => LUX.includes(b));
    if (br.length) parts.push(`${lux.length ? 'built-in luxury' : 'brand-name'} appliances (${(lux.length ? lux : br).slice(0, 3).join('/')})`);
    const ctr = mats(it.counter); if (ctr.length) parts.push(listJoin(ctr) + ' counters' + ((it.amen || []).includes('Waterfall Counter Edge') ? ' with waterfall edge' : ''));
    if (it.islands) parts.push(`${it.islands > 1 ? it.islands + ' islands' : 'an island'}${it.islandSeat ? ' with bar seating' : ''}`);
  } else {
    const ct = cabTier(it.vanMat); if (ct) parts.push(ct + ' cabinetry');
    const ctr = mats(it.counter); if (ctr.length) parts.push(listJoin(ctr) + ' counters');
    if (it.shower) parts.push(`${listJoin(mats(it.showerMat)) || 'tile'} shower${(it.feat || []).includes('Frameless Glass') ? ' with frameless glass' : ''}`);

  const p = parts.filter(Boolean); let t = cap(listJoin(p)); if (t) t += '.';

/* ---------------- Storage check & photo recovery ---------------- */
async function storageCheck() {

    out.push('Storage open: ' + (DB.persistent ? 'yes' : 'NO – the app could not open its storage'));
    const ins = (await DB.all('inspections')) || []; out.push('Inspections stored: ' + ins.length);
    const ids = new Set(ins.map(i => i.id));
    const linked = new Set(); ins.forEach(i => (i.photos || []).forEach(p => p && linked.add(p.id)));
    const ph = (await DB.all('photos')) || []; out.push('Photos stored: ' + ph.length);
    ph.forEach(p => { if (!linked.has(p.id)) { const k = p.insId || '?'; if (!orphans.has(k)) orphans.set(k, []); orphans.get(k).push(p); } });
    const nOrph = [...orphans.values()].reduce((a, b) => a + b.length, 0);
    out.push('Photos not attached to any inspection: ' + nOrph + (orphans.size ? ' (from ' + orphans.size + ' inspection' + (orphans.size > 1 ? 's' : '') + (orphans.size && [...orphans.keys()].some(k => !ids.has(k)) ? ' that are no longer listed' : '') + ')' : ''));

  try { if (navigator.storage && navigator.storage.persisted) out.push('Protected from automatic cleanup: ' + ((await navigator.storage.persisted()) ? 'yes' : 'no')); } catch (e) {}
  try { if (indexedDB.databases) { const d = await indexedDB.databases(); out.push('Databases: ' + (d.map(x => x.name + ' v' + x.version).join(', ') || 'none')); } } catch (e) {}
  try { out.push('Opened as: ' + (navigator.standalone || matchMedia('(display-mode: standalone)').matches ? 'Home Screen app' : 'Safari tab') + ' · ' + location.host); } catch (e) {}
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  const groups = [...orphans.entries()];
  bg.innerHTML = `<div class="fatal" style="max-width:640px;width:100%;max-height:90vh;overflow:auto"><h2 style="color:#000">Storage check</h2>
    <p class="fatal-msg">${out.map(esc).join('<br>')}</p>
    ${groups.map(([k, arr], n) => `<div class="row"><button class="btn primary" data-recover="${esc(k)}">Recover ${arr.length} photo${arr.length > 1 ? 's' : ''} (group ${n + 1})</button></div>`).join('')}
    <p class="help">Take a screenshot of this box and send it to Claude.</p>

  document.body.appendChild(bg);

    b.disabled = true; b.textContent = 'Recovering…';
    try { await recoverPhotos(orphans.get(b.dataset.recover)); bg.remove(); toast('Photos recovered into a new inspection'); renderHome(); }
    catch (e) { b.textContent = 'Failed: ' + (e.message || e); }
  });
}
async function recoverPhotos(recs) {

  };

    <div id="jumpList" class="jump-list"></div><button class="btn" id="jumpClose">Close</button></div></div>`;

  const go = e => { bg.remove(); if (e.item) app.open.add(e.item); app.returnTo = null; goTab(e.tab, e.anchor || null, e.gid || null); if (e.anchor) { const el = document.getElementById(e.anchor); const box = el && el.querySelector('textarea, input.txt'); if (box && box.value) setTimeout(() => { try { box.focus({ preventScroll: true }); const qi = box.value.toLowerCase().indexOf(lastQ); if (qi >= 0) box.setSelectionRange(qi, qi + lastQ.length); } catch (x) {} }, 150); } };
  let lastQ = '';
  const draw = raw => {
    const q = raw.trim().toLowerCase(); lastQ = q; search(q);
    const navHits = nav.filter(e => !q || (e.label + ' ' + e.sub).toLowerCase().includes(q));
    list = [...found, ...navHits.map(e => ({ ...e, nav: true }))];

    case 'count':

    case 'review': { const items = f.items(ins) || [];
      html += items.length ? `<div class="review">${items.map(x => `<div class="rv-row"><span class="rv-l">${esc(x.label)}</span><span class="rv-v ${x.value ? '' : 'empty'}">${esc(x.value || 'Not entered')}</span>${x.go ? `<button class="btn sm" data-go="${esc(x.go)}" data-ret="${esc(ctx.sec + '|' + id + '|' + (ctx.group || '') + '|' + f.l)}">Change ›</button>` : ''}</div>`).join('')}</div>` : '<div class="calc-text">Nothing entered yet.</div>'; break; }
    case 'calc': html += typeof v === 'string' ? `<div class="calc-text">${esc(v)}</div>` : `<div class="calc">${esc(Number(v || 0).toLocaleString())}</div>`; break;
    case 'appliances': html += applianceWidget(d, ctx, f); break;
    case 'photo': html += photoSlot({ sec: ctx.sec, field: f.k, label: f.l, cat: f.cat, required: req }); break;
  }
  return html + '</div>';
}

async function loadOrdersFile(file) {
  if (!file) return; toast('Reading the orders file…');
  try {
    let d; try { d = JSON.parse(await file.text()); } catch (e) { throw new Error('“' + file.name + '” is not an orders file. Pick “Active Orders.json” or an “Order … .json” file from the Appraisal Assistant.'); }
    if (d.app !== 'appraisal-assistant' || d.kind !== 'active-orders') throw new Error('That is not an Active Orders file from the Appraisal Assistant.');
    const old = await DB.get('sketches', 'orders:active');
    const keep = new Set(); const orders = [];
    const incoming = d.orders || [];
    if (d.single && old) for (const o of old.orders || []) if (!incoming.some(x => x.id === o.id)) { orders.push(o); (o.plans || []).forEach(pl => keep.add(pl.key)); }   // one order: add it to the list, keep the others
    for (const o of incoming) {
      const plans = [];
      for (let n = 0; n < (o.plans || []).length; n++) { const key = 'plan:' + o.id + ':' + n; await DB.put('sketches', { id: key, src: o.plans[n].src, name: o.plans[n].name }); plans.push({ key, name: o.plans[n].name }); keep.add(key); }
      orders.push({ ...o, plans });
    }
    await DB.put('sketches', { id: 'orders:active', made: d.single && old ? old.made : d.made, orders });
    // floor plans of orders no longer on the list stay only if an inspection uses them
    const inUse = new Set(); ((await DB.all('inspections')) || []).forEach(i => (((i.data || {}).property || {}).order || { plans: [] }).plans.forEach(pl => inUse.add(pl.key)));
    if (old) for (const o of old.orders || []) for (const pl of o.plans || []) if (!keep.has(pl.key) && !inUse.has(pl.key)) await DB.del('sketches', pl.key);
    toast(d.single ? 'Added ' + (String((incoming[0] || {}).address || '').split(',')[0] || 'the order') + ' – ' + orders.length + ' active order' + (orders.length === 1 ? '' : 's') + ' on this iPad' : orders.length + ' active order' + (orders.length === 1 ? '' : 's') + ' on this iPad'); renderHome();

    } else {
      const sNames = sfrepNames(names); const entries = [{ name: base + '.xml', data: buildMISMO(ins, sNames) }];
      for (const p of ins.photos.filter(p => !p.extra)) { const rec = await DB.get('photos', p.id); if (rec) entries.push({ name: 'Images/' + sNames.get(p.id), data: rec.blob }); }
      blob = await makeZip(entries); fname = base + ' – SFREP.zip';
    }
    const r = await deliver(blob, fname);
    if (r === 'shared' || r === 'downloaded') { ins.exported = Date.now(); save(); toast(r === 'shared' ? 'Exported' : 'Downloaded ' + fname); }
    else if (r === 'blocked') toast('This preview cannot save files. Use the installed app to export.');
  } catch (e) { console.error(e); toast('Export failed: ' + (e.message || e)); }
  btn.disabled = false; btn.textContent = old;
}

async function restoreBackup(file) {
  if (!file) return;
  try {
    const files = await readZip(file); const json = files.get('inspection-backup.json');
    if (!json) throw new Error('This zip has no inspection backup. Choose a Workfile package exported by this app.');
    const data = JSON.parse(new TextDecoder().decode(json)); const ins = normalize(data.inspection);
    const names = photoFileNames(ins); let n = 0;
    if (await DB.get('inspections', ins.id)) { ins.id = uid(); ins.data.property.fileName = insTitle(ins) + ' (restored copy)'; }
    for (const p of ins.photos) {
      const bytes = files.get('Photos/' + names.get(p.id)); if (!bytes) continue;
      const blob = new Blob([bytes], { type: 'image/jpeg' }); const { thumb } = await processImage(new File([blob], 'p.jpg', { type: 'image/jpeg' }));
      if (await DB.get('photos', p.id)) p.id = uid();
      await DB.put('photos', { id: p.id, insId: ins.id, blob, thumb }); n++;
    }
    await DB.put('inspections', ins); toast(`Restored with ${n} photos`); openInspection(ins.id);
  } catch (e) { toast(e.message || 'Could not restore that file'); }
}

function permitNotes(ins) {
  const P = ins.data.property.permits; if (!P) return '';
  const items = permitItems(P);
  return `<section><h2>County permit history by parcel</h2><p class="meta">From ${esc(P.file || 'County report')}, loaded ${esc(P.loadedAt || '')}. Dates are application (file) dates.</p>
<table>${P.zoning ? `<tr><th>Zoning</th><td>${esc(P.zoning)}</td></tr>` : ''}<tr><th>Parcel holds</th><td>${P.holds.length ? esc(P.holds.join(' / ')) : 'None shown'}</td></tr></table>
${items.length ? `<h3>Permits and cases</h3><table>${items.map(i => `<tr><th>${esc(i.date)}</th><td>${esc(i.what)} · ${esc(i.dept)}${i.status ? ' · ' + esc(i.status) : ''} · ${esc(i.num)}</td></tr>`).join('')}</table>` : ''}</section>`;
}
function crsNotes(ins) {
  const c = ins.data.property.crs; if (!c) return '';
  const r = (l, v) => v ? `<tr><th>${esc(l)}</th><td>${esc(v)}</td></tr>` : '';
  return `<section><h2>Public record (CRS Data, ${esc(c.loadedAt || '')})</h2><table>${r('Address', [c.addr, c.cityLine].join(', '))}${r('APN', c.apn)}${r('Owner of record', c.owner)}${r('Land use', c.landUse)}${r('Year built (assessor / MLS)', [c.yearBuilt, c.yearBuiltMls].filter(Boolean).join(' / '))}${r('Beds / baths (assessor)', [c.beds, c.baths].filter(Boolean).join(' / '))}${r('Public record sq. ft.', c.sqft)}${r('Lot size', [c.lotSf && c.lotSf + ' sq. ft.', c.acres && c.acres + ' ac.'].filter(Boolean).join(' / '))}${r('Latitude / longitude', c.lat ? c.lat + ', ' + c.lng : '')}${r('Census tract', c.census)}${r('FEMA flood zone', [c.fema, c.femaRisk, c.femaPanel, c.femaDate].filter(Boolean).join(' · '))}</table>
  ${(c.sales || []).length ? `<h3>Sales / transfer history</h3><table><tr><th>Date</th><td><b>Amount · Instrument · Buyer · Doc #</b></td></tr>${c.sales.map(x => `<tr><th>${esc(x.date)}</th><td>${esc([x.amount, x.instrument, x.buyer, x.doc].filter(Boolean).join(' · '))}</td></tr>`).join('')}</table>` : ''}
  ${(c.loans || []).length ? `<h3>Mortgage history</h3><table>${c.loans.map(x => `<tr><th>${esc(x.date)}</th><td>${esc([x.amount, x.lender, x.doc].filter(Boolean).join(' · '))}</td></tr>`).join('')}</table>` : ''}</section>`;
}

/* ---------------- Boot ---------------- */
function showFatal(msg, where) {
  const root = document.getElementById('app'); if (!root || document.getElementById('fatal')) return;
  const box = document.createElement('div'); box.id = 'fatal'; box.className = 'fatal';
  box.innerHTML = `<h2>Something went wrong</h2><p>Your inspections are still saved on this iPad. <b>Do not delete the app icon</b> – that would erase them.</p>
    <p class="fatal-msg">${esc(String(msg || 'Unknown error'))}${where ? ' · ' + esc(where) : ''}</p>
    <div class="row"><button class="btn primary" id="fatalHome">Go to my inspections</button><button class="btn" id="fatalReload">Reload app</button></div>
    <p class="help">Take a screenshot of this box and send it to Claude.</p>`;
  root.prepend(box); window.scrollTo(0, 0);
  box.querySelector('#fatalHome').onclick = async () => { try { await saveNow(); } catch (e) {} box.remove(); renderHome(); };
  box.querySelector('#fatalReload').onclick = () => location.reload();
}
window.addEventListener('error', e => { if (!e.message || e.message === 'Script error.' || /ResizeObserver/.test(e.message)) return; showFatal(e.message, (e.filename ? 'line ' + e.lineno : '')); });
window.addEventListener('unhandledrejection', e => showFatal(e.reason && (e.reason.message || e.reason), 'promise'));

(async function boot() {
  try { hcInit(); } catch (e) {}
  try { if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|anthropic/.test(location.host)) navigator.serviceWorker.register('sw.js'); } catch (e) {}
  const msg = document.getElementById('bootMsg'); if (msg) msg.textContent = 'Opening saved inspections…';
  // never wait forever on storage
  const ok = await Promise.race([DB.ready, new Promise(r => setTimeout(() => r('timeout'), 15000))]);
  if (ok !== true) {
    $('#app').innerHTML = `<div class="fatal"><h2>The iPad's storage is not responding</h2><p>Your inspections are still saved. <b>Do not delete the app icon.</b></p>
      <p>Close the app fully (swipe up and flick it away), wait 10 seconds and open it again. If this keeps happening, restart the iPad.</p>
      <div class="row"><button class="btn primary" onclick="location.reload()">Try again</button></div></div>`;
    return;
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
  try { if (typeof APP_CFG !== 'undefined' && APP_CFG.test) { document.documentElement.classList.add('testcopy'); const f = document.createElement('div'); f.className = 'testflag'; f.textContent = 'TEST COPY – separate storage, not for real inspections · version ' + (typeof BUILD !== 'undefined' ? BUILD : '?'); document.body.prepend(f); } } catch (e) {}
  const q = new URLSearchParams(location.search); const openId = q.get('open');
  if (openId) { history.replaceState(null, '', location.pathname); const rec = await DB.get('inspections', openId); if (rec) { openInspection(openId, q.get('tab')); return; } }
  renderHome();
})();

</script>
