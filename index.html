<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UAD Field Inspection</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inspection">
<meta name="theme-color" content="#0b8f96">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: top bar + scrolling tab strip, single content column sized for iPad 11" in either orientation.
   Palette: white field sheet, turquoise chrome, orange action, SFREP-style green (required) / blue (optional) / red (warning). */
:root {
  --bg: #ffffff;
  --paper: #f4f9fa;
  --ink: #12302f;
  --ink-2: #4b6766;
  --line: #d5e6e7;
  --teal: #0b8f96;
  --teal-dk: #066a70;
  --teal-lt: #e0f4f5;
  --orange: #f07c19;
  --orange-dk: #c45f06;
  --orange-lt: #fff0e2;
  --req: #1f8a3e;
  --req-lt: #e5f5ea;
  --opt: #1f63c6;
  --opt-lt: #e7effb;
  --warn: #d42b2b;
  --warn-lt: #fdeaea;
  --font: "Atkinson Hyperlegible", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.4 var(--font); -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* ---------- App bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--teal); color: #fff; }
.bar-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 56px; }
.bar .title { flex: 1; min-width: 0; }
.bar .title b { display: block; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .title span { display: block; font-size: 13px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .icon-btn { background: rgba(255,255,255,.14); border: 0; color: #fff; border-radius: 8px; padding: 9px 13px; font-weight: 700; font-size: 15px; }
.saved { font-size: 13px; opacity: .9; white-space: nowrap; }
.attn-pill { background: var(--orange); color: #fff; border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 15px; white-space: nowrap; }
.attn-pill.ok { background: rgba(255,255,255,.18); }

.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 0 12px 0; background: var(--teal-dk); scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: transparent; color: #d3f0f1; padding: 12px 14px 11px; font-weight: 700; font-size: 15px; border-bottom: 4px solid transparent; white-space: nowrap; position: relative; }
.tab[aria-selected="true"] { color: #fff; border-bottom-color: var(--orange); }
.tab .dot { display: inline-block; min-width: 20px; height: 20px; line-height: 20px; border-radius: 10px; background: var(--warn); color: #fff; font-size: 12px; text-align: center; margin-left: 6px; padding: 0 5px; }
.tab .dot.done { background: var(--req); }

main { max-width: 1080px; margin: 0 auto; padding: 16px 16px 120px; }

/* ---------- Groups & fields ---------- */
.group { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 18px; overflow: hidden; }
.group > h2 { font-size: 17px; text-transform: uppercase; letter-spacing: .06em; color: var(--teal-dk); background: var(--paper); padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.group > h2 .count { margin-left: auto; font-size: 14px; letter-spacing: 0; text-transform: none; color: var(--ink-2); font-weight: 400; }
.fields { display: grid; grid-template-columns: 1fr; gap: 0; }
.field { padding: 12px 16px 14px 18px; border-bottom: 1px solid var(--line); position: relative; min-width: 0; }
.field:last-child { border-bottom: 0; }
.field::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--opt); }
.field.req::before { background: var(--req); }
.field.missing::before { background: var(--warn); }
.flabel { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; font-weight: 700; font-size: 16px; }
.flabel .tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: var(--opt-lt); color: var(--opt); }
.field.req .flabel .tag { background: var(--req-lt); color: var(--req); }
.field.missing .flabel .tag { background: var(--warn-lt); color: var(--warn); }
.flabel .fid { font-family: var(--mono); font-size: 12px; color: var(--ink-2); font-weight: 400; }
.flabel .lab { color: var(--ink); }
.field.req .flabel .lab { color: var(--req); }
.field.missing .flabel .lab { color: var(--warn); }
.help { font-size: 14px; color: var(--ink-2); margin: -4px 0 8px; }
.calc { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--teal-dk); }
.info { background: var(--teal-lt); color: var(--teal-dk); font-size: 15px; padding: 10px 14px; border-radius: 8px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 2px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 14px; min-height: 46px; font-size: 16px; line-height: 1.2; display: inline-flex; align-items: center; gap: 8px; text-align: left; }
.chip .box { width: 20px; height: 20px; border: 2px solid var(--ink-2); border-radius: 4px; flex: none; display: grid; place-items: center; }
.chip.radio .box { border-radius: 50%; }
.chip[aria-pressed="true"] { border-color: var(--teal); background: var(--teal-lt); color: var(--teal-dk); font-weight: 700; }
.chip[aria-pressed="true"] .box { background: var(--teal); border-color: var(--teal); }
.chip[aria-pressed="true"] .box::after { content: ""; width: 9px; height: 5px; border: 3px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px,-1px); }
.chip.radio[aria-pressed="true"] .box::after { width: 8px; height: 8px; border: 0; background: #fff; border-radius: 50%; transform: none; }
.yn .chip { min-width: 96px; justify-content: center; }

input.txt, select.txt, textarea.txt { width: 100%; border: 2px solid var(--line); border-radius: 8px; padding: 11px 12px; background: var(--bg); min-height: 48px; font-size: 17px; }
input.txt:focus, select.txt:focus, textarea.txt:focus { border-color: var(--teal); outline: none; }
input.num { max-width: 220px; font-variant-numeric: tabular-nums; }
textarea.txt { min-height: 96px; resize: vertical; line-height: 1.45; }
.limit { font-size: 13px; color: var(--ink-2); text-align: right; margin-top: 4px; font-variant-numeric: tabular-nums; }
.limit.over { color: var(--warn); font-weight: 700; }

.stepper { display: inline-flex; align-items: center; border: 2px solid var(--line); border-radius: 8px; overflow: hidden; }
.stepper button { width: 54px; height: 48px; border: 0; background: var(--paper); font-size: 26px; font-weight: 700; color: var(--teal-dk); }
.stepper output { min-width: 64px; text-align: center; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- Photos ---------- */
.photo-slot { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
.cam { display: inline-flex; align-items: center; gap: 8px; border: 2px dashed var(--orange); color: var(--orange-dk); background: var(--orange-lt); border-radius: 10px; padding: 12px 16px; min-height: 56px; font-weight: 700; font-size: 16px; position: relative; overflow: hidden; }
.cam input { position: absolute; inset: 0; opacity: 0; font-size: 0; cursor: pointer; }
.cam.lib { border-color: var(--line); color: var(--ink-2); background: var(--paper); }
.cam svg { width: 22px; height: 22px; flex: none; }
.thumb { width: 132px; border-radius: 8px; overflow: hidden; border: 2px solid var(--line); background: var(--paper); padding: 0; text-align: left; }
.thumb img { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; max-width: 100%; }
.thumb span { display: block; font-size: 12px; padding: 5px 7px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb.req { border-color: var(--req); }

.extra-photos { border-top: 1px solid var(--line); padding: 14px 16px; background: var(--paper); display: flex; flex-direction: column; gap: 10px; }
.extra-photos h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }

/* ---------- Lists ---------- */
.list-items { display: flex; flex-direction: column; gap: 0; }
.item { border-top: 1px solid var(--line); }
.item-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--bg); }
.item-head .name { flex: 1; min-width: 0; font-weight: 700; font-size: 18px; color: var(--teal-dk); border: 0; background: none; text-align: left; padding: 6px 0; }
.item-head .name small { font-weight: 400; color: var(--ink-2); font-size: 14px; margin-left: 8px; }
.item-head .badge { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 4px; background: var(--warn-lt); color: var(--warn); white-space: nowrap; }
.item-head .badge.ok { background: var(--req-lt); color: var(--req); }
.btn { border: 2px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 16px; font-weight: 700; min-height: 46px; font-size: 16px; }
.btn.primary { background: var(--orange); border-color: var(--orange); color: #fff; }
.btn.teal { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn.danger { color: var(--warn); border-color: #f2c4c4; }
.btn.danger.solid { background: var(--warn); border-color: var(--warn); color: #fff; }
.btn.sm { padding: 6px 12px; min-height: 40px; font-size: 14px; }
.add-row { padding: 14px 16px; display: flex; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); background: var(--paper); }
.item-body { border-left: 4px solid var(--teal-lt); margin-left: 16px; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--warn-lt); color: var(--warn); font-weight: 700; }

/* ---------- Home ---------- */
.home-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin: 8px 0 18px; }
.home-head h1 { font-size: 28px; color: var(--teal-dk); flex: 1; }
.new-form { background: var(--orange-lt); border: 2px solid #ffd2a8; border-radius: var(--r); padding: 16px; display: grid; gap: 12px; grid-template-columns: 1fr; margin-bottom: 22px; }
.new-form h2 { font-size: 18px; color: var(--orange-dk); }
.cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.card { border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); text-align: left; }
.card b { font-size: 18px; color: var(--teal-dk); }
.card .meta { font-size: 14px; color: var(--ink-2); }
.card .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.prog { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--req); }

/* ---------- Attention ---------- */
.att { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.att:first-of-type { border-top: 0; }
.att .sev { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 3px 8px; border-radius: 4px; flex: none; }
.sev.Required { background: var(--warn-lt); color: var(--warn); }
.sev.Photo { background: var(--warn-lt); color: var(--warn); }
.sev.Recommended { background: var(--orange-lt); color: var(--orange-dk); }
.sev.Check { background: var(--opt-lt); color: var(--opt); }
.att .what { flex: 1; min-width: 200px; }
.att .what small { display: block; color: var(--ink-2); font-size: 14px; }
.att.overridden { opacity: .6; }
.att .ovr { width: 100%; display: flex; gap: 8px; }
.att .ovr input { flex: 1; }

/* ---------- Summaries ---------- */
.sum { padding: 14px 16px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.sum:first-of-type { border-top: 0; }
.sum h3 { font-size: 17px; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.sum h3 .fid { font-family: var(--mono); font-size: 13px; color: var(--ink-2); font-weight: 400; }
.sum .auto { background: var(--paper); border-radius: 8px; padding: 12px; font-size: 16px; line-height: 1.5; white-space: pre-wrap; }
.sum .auto.empty { color: var(--ink-2); font-style: italic; }
.sum .dropped { font-size: 14px; color: var(--orange-dk); }

/* ---------- Gallery ---------- */
.gal-sec h3 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--teal-dk); padding: 14px 16px 6px; }
.gal { display: flex; flex-wrap: wrap; gap: 10px; padding: 6px 16px 16px; }
.missing-photos { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 14px; }
.missing-photos span { border: 2px dashed var(--warn); color: var(--warn); border-radius: 8px; padding: 6px 10px; font-size: 14px; font-weight: 700; }

/* ---------- Viewer / sheet ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(5,30,32,.6); z-index: 50; display: grid; place-items: center; padding: 16px; }
.sheet { background: var(--bg); border-radius: 14px; max-width: 760px; width: 100%; max-height: 92vh; overflow: auto; }
.sheet img { display: block; width: 100%; max-height: 60vh; object-fit: contain; background: #000; }
.sheet .body { padding: 16px; display: grid; gap: 12px; }
.sheet .row { display: flex; gap: 10px; flex-wrap: wrap; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 10px; z-index: 60; font-weight: 700; max-width: calc(100% - 32px); }

.exp { padding: 16px; display: grid; gap: 12px; border-top: 1px solid var(--line); }
.exp:first-of-type { border-top: 0; }
.exp p { margin: 0; color: var(--ink-2); font-size: 15px; max-width: 65ch; }
.exp .row { display: flex; gap: 10px; flex-wrap: wrap; }
.note-box { background: var(--opt-lt); color: var(--opt); border-radius: 8px; padding: 10px 14px; font-size: 15px; }
.warn-box { background: var(--warn-lt); color: var(--warn); border-radius: 8px; padding: 10px 14px; font-size: 15px; font-weight: 700; }

.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); margin: 0 0 14px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

@media (min-width: 900px) {
  .fields.two { grid-template-columns: 1fr 1fr; }
  .fields.two .field.wide { grid-column: 1 / -1; }
  .fields.two .field:nth-last-child(2):not(.wide) { border-bottom: 0; }
  .fields.two .field:nth-child(odd):not(.wide) { border-right: 1px solid var(--line); }
  .new-form { grid-template-columns: 2fr 1fr auto; align-items: end; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>

/* ---------------- Utilities ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const isEmpty = v => v === undefined || v === null || v === '' || (Array.isArray(v) && v.length === 0);
const optsOf = f => (typeof f.o === 'function' ? f.o() : f.o) || [];
const labelFor = (f, v) => { const o = optsOf(f).find(x => x[0] === v); return o ? o[1] : v; };
const valText = (f, v) => {
  if (isEmpty(v)) return '';
  if (f.t === 'yn') return v ? 'Yes' : 'No';
  if (Array.isArray(v)) return v.map(x => labelFor(f, x)).join(', ');
  if (f.t === 'money') return '$' + Number(v).toLocaleString();
  return String(labelFor(f, v));
};
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

/* ---------------- Storage (IndexedDB with memory fallback) ---------------- */
const DB = (() => {
  let db = null; const mem = { inspections: new Map(), photos: new Map() };
  const open = () => new Promise(res => {
    try {
      const r = indexedDB.open('uad36-inspect', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('inspections', { keyPath: 'id' }); const p = d.createObjectStore('photos', { keyPath: 'id' }); p.createIndex('ins', 'insId'); };
      r.onsuccess = () => { db = r.result; res(true); };
      r.onerror = () => res(false);
    } catch (e) { res(false); }
  });
  const tx = (store, mode, fn) => new Promise((res, rej) => {
    if (!db) { res(fn(null)); return; }
    const t = db.transaction(store, mode); const s = t.objectStore(store); let out; const r = fn(s);
    if (r && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
  return {

      let t = `${LISTS.outbuildings.name(o, i)}: ${lc(o.type || 'outbuilding')}${o.area ? ' of approximately ' + o.area + ' sq. ft.' : ''}${f.length ? ' with ' + listJoin(f) : ''}`;
      if (o.living) t += `; living quarters with ${o.beds || 0} bedroom(s), ${o.fullBaths || 0} full bath(s), kitchen: ${lc(o.kitchen || 'none')}`;
      if (o.permitted) t += `; structure permitted: ${lc(o.permitted)}`;
      return S(t, 1);
    });
  },
  functional(ins) {
    const d = ins.data.condition; const f = lvl(ins, 'condition', 'func'); if (!f.length) return [];
    return [S(`Functional issues observed: ${listJoin(f)}${d.cure ? '. Curability: ' + lc(d.cure) : ''}`, 1)];
  },
  vehicle(ins) {
    const g = ins.data.garage, d = ins.data.driveway, out = [];
    if (g.hasGarage) {
      const feat = lvl(ins, 'garage', 'garFeat');
      out.push(S(`The property has a${/^[aeiou]/i.test(sv(ins, 'garage', 'garAttach')) ? 'n' : ''} ${lc(sv(ins, 'garage', 'garAttach'))} ${g.garSpaces || '[ ]'}-car garage${g.garTandem ? ' including ' + g.garTandem + ' tandem space' + (g.garTandem > 1 ? 's' : '') : ''}${g.garArea ? ' (' + g.garArea + ' sq. ft.)' : ''}${g.garFinish ? ', ' + lc(g.garFinish) : ''}`, 1));
      if (g.garConverted) out.push(S(`The garage has been converted (${lc(g.garConvPermit || 'permit status unknown')})`, 1));
      if (feat.length) out.push(S(`Garage features include ${listJoin(feat)}`, 2));
    } else if (g.hasGarage === false) out.push(S('There is no garage', 1));
    if (d.hasDrive) out.push(S(`The driveway accommodates approximately ${d.driveSpaces || '[ ]'} vehicles`, 2));
    if (g.carport) out.push(S(`${g.carport}-car carport`, 2));
    const op = lvl(ins, 'garage', 'otherPark'); if (op.length) out.push(S(`Other parking: ${listJoin(op)}`, 3));
    return out;
  },
  amenities(ins) {
    const a = ins.data.amenities, out = [];
    ins.lists.outdoorLiving.forEach(o => { const f = (o.feat || []).map(lc); out.push(S(`${o.area ? 'A ' + o.area + ' sq. ft. ' : 'A '}${lc(lv('outdoorLiving', o, 'material'))} ${lc(lv('outdoorLiving', o, 'type'))}${f.length ? ' (' + listJoin(f) + ')' : ''}`, 1)); });
    ins.lists.waterFeatures.forEach(w => { const f = (w.feat || []).map(lc); out.push(S(`${cap(lc(lv('waterFeatures', w, 'type')))}${w.mat ? ' (' + lc(w.mat) + ')' : ''}${f.length ? ', ' + listJoin(f) : ''}`, 1)); });
    const rec = lvl(ins, 'amenities', 'rec'); if (rec.length) out.push(S(`Recreation amenities include ${listJoin(rec)}`, 1));
    const od = lvl(ins, 'amenities', 'outdoor'); if (od.length) out.push(S(`Outdoor living amenities include ${listJoin(od)}`, 1));
    if (a.equestrian) { const e = lvl(ins, 'amenities', 'equine'); out.push(S(`Equestrian improvements include ${listJoin(e) || 'horse facilities'}${a.stalls ? ' with ' + a.stalls + ' stalls' : ''}`, 1)); }
    return out;
  },
  qc(ins) {
    const c = ins.data.condition, iv = ins.data.interview, out = [];
    if (c.oq || c.oc) out.push(S(`Overall ${c.oq || ''} quality and ${c.oc || ''} condition`.replace(/ +/g, ' '), 1));
    if (c.overallUpd) out.push(S(`The dwelling is ${lc(c.overallUpd)}`, 1));
    const yrs = [['kitchen', iv.kitYear, iv.kitScope], ['bathrooms', iv.bathYear, iv.bathScope]].filter(x => x[1] || x[2]);
    yrs.forEach(([n, y, sc]) => out.push(S(`The ${n} ${sc ? 'were ' + lc(sc).replace('updated', 'updated') : 'were updated'}${y ? ' in ' + y : ''}, per ${listJoin((iv.who || []).map(lc)) || 'the interviewee'}`, 1)));
    const sys = [['roof', iv.roofYear], ['HVAC', iv.hvacYear], ['water heater', iv.whYear], ['plumbing', iv.plumbYear], ['electrical', iv.elecYear], ['windows', iv.winYear], ['flooring', iv.floorYear], ['paint', iv.paintYear]].filter(x => x[1]);
    if (sys.length) out.push(S(`Reported component ages: ${sys.map(x => x[0] + ' ' + x[1]).join('; ')}`, 2));
    if (iv.repairs) out.push(S(`Reported repairs: ${iv.repairs}`, 2));
    if (iv.additions) out.push(S(`Additions / conversions: ${iv.additions}`, 2));
    return out;
  },
};

/* Build the final text for a comment target within its limit */
function buildComment(ins, target) {
  if (ins.finals[target.id] !== undefined && ins.finals[target.id] !== null) {
    const t = ins.finals[target.id]; return { text: t, dropped: [], edited: true, over: t.length > target.lim };
  }
  const gen = (GEN[target.id] ? GEN[target.id](ins) : []).filter(Boolean).filter(x => x.t && x.t !== '.');
  const user = (ins.comments[target.id] || '').trim();
  let keep = gen.map((g, i) => ({ ...g, i }));
  const join = arr => [arr.map(x => x.t).join(' '), user].filter(Boolean).join(' ');
  const dropped = [];
  while (join(keep).length > target.lim && keep.length) {
    let worst = keep.reduce((a, b) => (b.p > a.p || (b.p === a.p && b.i > a.i)) ? b : a);
    dropped.push(worst.t); keep = keep.filter(x => x !== worst);
  }
  let text = join(keep);
  const over = text.length > target.lim;
  return { text, dropped, edited: false, over };
}

/* Short kitchen / bath quality comment (UAD 10.040, 120 characters) */
function roomQualityComment(listKey, it) {
  const parts = [];
  if (listKey === 'kitchens') {
    if ((it.cab || []).length) parts.push(listJoin(it.cab.map(lc)) + ' cabinets');
    if ((it.counter || []).length) parts.push(listJoin(it.counter.map(lc)) + ' counters');
    const br = (it.brands || []).filter(b => b !== 'Other'); if (br.length) parts.push(br.slice(0, 3).join('/') + ' appliances');
    if (it.islands) parts.push(it.islandSeat ? 'island w/ seating' : 'island');
  } else {
    if (it.counter) parts.push(lc(it.counter) + ' counters');
    if (it.tubFree) parts.push('freestanding tub');
    if (it.shower) parts.push((it.showerMat ? lc(it.showerMat) + ' ' : '') + 'shower');
    if (it.tubShower) parts.push('tub/shower');
    const f = (it.feat || []).slice(0, 3).map(lc); parts.push(...f);
  }
  let t = cap(parts.join(', ')); if (t) t += '.';
  while (t.length > 120 && parts.length > 1) { parts.pop(); t = cap(parts.join(', ')) + '.'; }
  return t.slice(0, 120);
}

function renderField(f, d, ctx) {
  const ins = app.ins; d = d || {};
  if (!isShown(f, d, ins)) return '';
  const id = ctx.list ? `f-${ctx.list}-${ctx.item}-${f.k}` : `f-${ctx.sec}-${f.k}`;
  const data = ctx.list ? `data-list="${ctx.list}" data-item="${ctx.item}"` : `data-sec="${ctx.sec}"`;
  if (f.t === 'info') return `<div class="field wide"><div class="info">${esc(f.l)}</div></div>`;
  const req = isReq(f, d, ins);
  let v = d[f.k];
  let filled;
  if (f.t === 'photo') filled = photosInSlot(ins, { sec: ctx.sec, field: f.k }).length > 0;
  else if (f.t === 'calc') { v = f.calc(ins); filled = true; }
  else filled = !isEmpty(v);
  const over = f.lim && typeof v === 'string' && v.length > f.lim;
  const missing = (req && !filled) || over;
  const wide = ['multi', 'note', 'photo', 'one', 'dwbrands'].includes(f.t) && (f.t !== 'one' || optsOf(f).length > 4);
  const tag = f.t === 'photo' ? (req ? 'Required photo' : f.recommended ? 'Recommended photo' : 'Photo') : f.t === 'calc' ? 'Auto count' : (req ? 'Required' : 'Optional');
  let html = `<div class="field ${req ? 'req' : ''} ${missing ? 'missing' : ''} ${wide ? 'wide' : ''}" id="${id}">
    <div class="flabel"><span class="tag">${tag}</span><span class="lab">${esc(f.l)}</span>${f.fid ? `<span class="fid">${esc(f.fid)}</span>` : ''}</div>
    ${f.help ? `<div class="help">${esc(f.help)}</div>` : ''}`;
  const attr = `${data} data-k="${f.k}" data-t="${f.t}"`;
  switch (f.t) {
    case 'yn':
      html += `<div class="chips yn">${[[true, 'Yes'], [false, 'No']].map(([val, l]) => `<button class="chip radio" ${attr} data-v="${val}" aria-pressed="${v === val}"><span class="box"></span>${l}</button>`).join('')}</div>`; break;
    case 'one': case 'multi': {
      const o = optsOf(f); const multi = f.t === 'multi'; const arr = multi ? (v || []) : [v];
      html += `<div class="chips">${o.map(([c, l]) => `<button class="chip ${multi ? '' : 'radio'}" ${attr} data-v="${esc(c)}" aria-pressed="${arr.includes(c)}"><span class="box"></span>${esc(l)}</button>`).join('')}</div>`; break;
    }
    case 'sel': html += `<select class="txt" ${attr}><option value="">Choose…</option>${optsOf(f).map(([c, l]) => `<option value="${esc(c)}" ${v === c ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`; break;
    case 'num': case 'money': case 'year':
      html += `<input class="txt num" inputmode="${f.t === 'money' ? 'decimal' : 'numeric'}" ${attr} value="${esc(v ?? '')}" placeholder="${f.t === 'year' ? 'YYYY' : f.t === 'money' ? '$' : ''}">`; break;
    case 'date': html += `<input class="txt num" type="date" ${attr} value="${esc(v || '')}">`; break;
    case 'text': html += `<input class="txt" ${attr} value="${esc(v || '')}" ${f.lim ? `maxlength="${f.lim}"` : ''}>`; break;
    case 'note':
      html += `<textarea class="txt" ${attr} placeholder="${f.lim ? 'Max ' + f.lim + ' characters' : 'Notes for your workfile'}">${esc(v || '')}</textarea>`;
      if (f.lim) html += `<div class="limit ${over ? 'over' : ''}" data-limit="${f.lim}">${(v || '').length} / ${f.lim}</div>`; break;
    case 'count':
      html += `<div class="stepper"><button ${attr} data-step="-1" aria-label="Decrease">−</button><output>${v ?? '–'}</output><button ${attr} data-step="1" aria-label="Increase">+</button></div>`; break;
    case 'calc': html += `<div class="calc">${esc(Number(v || 0).toLocaleString())}</div>`; break;
    case 'dwbrands': {
      const n = d.dw || 0; const arr = v || [];
      html += `<div class="fields">${Array.from({ length: n }, (_, i) => `<div><div class="help">Dishwasher ${i + 1}</div><select class="txt" ${attr} data-idx="${i}"><option value="">Brand…</option>${APPL_BRANDS.map(([c, l]) => `<option ${arr[i] === c ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>`).join('')}</div>`; break;
    }
    case 'photo': {
      const slot = { sec: ctx.sec, field: f.k, label: f.l, cat: f.cat, required: req };
      html += photoSlot(slot); break;
    }
  }
  return html + '</div>';
}

function computeIssues(ins) {

    });

  }));
  const L2 = ins.lists, d = ins.data;

  const area = { Site: ['site', 'siteDefects'], 'Dwelling Exterior': ['exterior', 'extDefects'], 'Unit Interior': ['interior', 'intDefects'], 'Subject Property Amenities': ['amenities', 'amenDefects'], 'Vehicle Storage': ['garage', 'vsDefects'] };

  const sv = X(SI, 'SITE_VIEWS'); (d.site.view || []).forEach((t, i) => { const v = X(sv, 'SITE_VIEW', { 'xlink:label': 'SITE_VIEW_' + (i + 1) }); V(v, 'ValueMarketabilityImpactType', d.site.viewImpact); V(v, 'ViewPrimaryIndicator', String(i === 0)); V(v, 'ViewRangeType', d.site.viewRange); V(v, 'ViewType', t); });

  });
  V(X(X(VR, 'VALUATION_SOFTWARE_SYSTEMS'), 'VALUATION_SOFTWARE_SYSTEM'), 'ValuationSoftwareProductName', 'UAD Field Inspection (iPad)');

  const dc = X(doc, 'DOCUMENT_CLASSIFICATION'); V(X(X(dc, 'DOCUMENT_CLASSES'), 'DOCUMENT_CLASS'), 'DocumentType', 'AppraisalReport');

/* ---------------- Export actions ---------------- */
async function photoEntries(ins, names, prefix) {
  const out = [];
  for (const p of ins.photos) { const rec = await DB.get('photos', p.id); if (rec) out.push({ name: prefix + names.get(p.id), data: rec.blob }); }
  return out;
}
async function doExport(kind, btn) {
  const ins = app.ins; const old = btn.textContent; btn.disabled = true; btn.textContent = 'Building…';
  try {
    const names = photoFileNames(ins); const base = safeName(insTitle(ins) + ' ' + (ins.data.property.addr || ''));
    let blob, fname;
    if (kind === 'workfile') {
      const sNames = sfrepNames(names);
      const sfrepPhotos = ins.photos.filter(p => !p.extra);
      const entries = [
        { name: 'Inspection Notes.html', data: notesHTML(ins, names) },
        { name: 'inspection-backup.json', data: JSON.stringify({ app: 'uad36-inspect', version: 1, inspection: ins }) },
        ...(await photoEntries(ins, names, 'Photos/')),
        { name: 'SFREP/' + base + '.xml', data: buildMISMO(ins, sNames) },
      ];
      for (const p of sfrepPhotos) { const rec = await DB.get('photos', p.id); if (rec) entries.push({ name: 'SFREP/Images/' + sNames.get(p.id), data: rec.blob }); }
      blob = await makeZip(entries); fname = base + ' – Workfile.zip';
    } else {
      const sNames = sfrepNames(names); const entries = [{ name: base + '.xml', data: buildMISMO(ins, sNames) }];
      for (const p of ins.photos.filter(p => !p.extra)) { const rec = await DB.get('photos', p.id); if (rec) entries.push({ name: 'Images/' + sNames.get(p.id), data: rec.blob }); }
      blob = await makeZip(entries); fname = base + ' – SFREP.zip';
    }
    const r = await deliver(blob, fname);
    if (r === 'shared' || r === 'downloaded') { ins.exported = Date.now(); save(); toast(r === 'shared' ? 'Exported' : 'Downloaded ' + fname); }
    else if (r === 'blocked') toast('This preview cannot save files. Use the installed app to export.');
  } catch (e) { console.error(e); toast('Export failed: ' + (e.message || e)); }
  btn.disabled = false; btn.textContent = old;
}

async function restoreBackup(file) {
  if (!file) return;
  try {
    const files = await readZip(file); const json = files.get('inspection-backup.json');
    if (!json) throw new Error('This zip has no inspection backup. Choose a Workfile package exported by this app.');
    const data = JSON.parse(new TextDecoder().decode(json)); const ins = normalize(data.inspection);
    const names = photoFileNames(ins); let n = 0;
    if (await DB.get('inspections', ins.id)) { ins.id = uid(); ins.data.property.fileName = insTitle(ins) + ' (restored copy)'; }
    for (const p of ins.photos) {
      const bytes = files.get('Photos/' + names.get(p.id)); if (!bytes) continue;
      const blob = new Blob([bytes], { type: 'image/jpeg' }); const { thumb } = await processImage(new File([blob], 'p.jpg', { type: 'image/jpeg' }));
      if (await DB.get('photos', p.id)) p.id = uid();
      await DB.put('photos', { id: p.id, insId: ins.id, blob, thumb }); n++;
    }
    await DB.put('inspections', ins); toast(`Restored with ${n} photos`); openInspection(ins.id);
  } catch (e) { toast(e.message || 'Could not restore that file'); }
}
